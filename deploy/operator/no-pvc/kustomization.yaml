apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset-base.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: rhiza
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: data
            emptyDir: {}
      - op: remove
        path: /spec/volumeClaimTemplates
