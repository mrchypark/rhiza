apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhiza-operator
  namespace: rhiza
  labels:
    app.kubernetes.io/name: rhiza-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhiza-operator
    spec:
      serviceAccountName: rhiza-operator
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: rhiza-operator:latest
          imagePullPolicy: IfNotPresent
          args: ["--namespace=$(POD_NAMESPACE)"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: rhiza-config
            - secretRef:
                # Existing bucket endpoint and credentials. The controller also
                # creates separate, generation-scoped peer credential secrets.
                name: rhiza-object-store
            - configMapRef:
                # Optional. Supplying this enables the recovery-anchor client;
                # without it the operator keeps its existing non-anchor path.
                name: rhiza-recovery-anchor
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: recovery-anchor-token
              mountPath: /var/run/secrets/rhiza-recovery-anchor-token
              readOnly: true
            - name: recovery-anchor-ca
              mountPath: /var/run/secrets/rhiza-recovery-anchor-ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: recovery-anchor-token
          secret:
            secretName: rhiza-recovery-anchor-token
            optional: true
        - name: recovery-anchor-ca
          configMap:
            name: rhiza-recovery-anchor-ca
            optional: true
