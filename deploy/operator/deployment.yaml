apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhiza-operator
  namespace: rhiza
  labels:
    app.kubernetes.io/name: rhiza-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhiza-operator
    spec:
      serviceAccountName: rhiza-operator
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: rhiza-operator:latest
          imagePullPolicy: IfNotPresent
          args: ["--namespace=$(POD_NAMESPACE)", "--identity=$(POD_NAME)"]
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: rhiza-config
            - secretRef:
                # Existing bucket endpoint and credentials. The controller also
                # creates separate, generation-scoped peer credential secrets.
                name: rhiza-object-store
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
