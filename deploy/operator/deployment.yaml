apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhiza-operator
  namespace: rhiza
  labels:
    app.kubernetes.io/name: rhiza-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhiza-operator
    spec:
      serviceAccountName: rhiza-operator
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: rhiza-operator:latest
          imagePullPolicy: IfNotPresent
          args: ["--namespace=$(POD_NAMESPACE)"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: rhiza-config
            - secretRef:
                # Existing bucket endpoint and credentials. The controller also
                # creates separate, generation-scoped peer credential secrets.
                name: rhiza-object-store
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
