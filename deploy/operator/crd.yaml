apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rhizarecoveries.rhiza.mrchypark.dev
spec:
  group: rhiza.mrchypark.dev
  scope: Namespaced
  names:
    plural: rhizarecoveries
    singular: rhizarecovery
    kind: RhizaRecovery
    shortNames: [rhizarecovery]
  versions:
    - name: v1alpha2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [target, expectedGeneration]
              x-kubernetes-validations:
                - rule: '!has(self.statefulSet) && !has(self.container) && !has(self.sourceClusterID) && !has(self.durability) && !has(self.recoveryID) && !has(self.allowDataLoss) && !has(self.maxArchiveAgeSeconds) && !has(self.anchorID) && !has(self.fence) && !has(self.membership)'
                  message: legacy recovery fields are unsupported
                - rule: self.target == oldSelf.target
                  message: target is immutable
                - rule: self.expectedGeneration == oldSelf.expectedGeneration
                  message: expectedGeneration is immutable
                - rule: '(has(self.backoffLimit) ? self.backoffLimit : 6) == (has(oldSelf.backoffLimit) ? oldSelf.backoffLimit : 6)'
                  message: effective backoffLimit is immutable
                - rule: 'has(self.activeDeadlineSeconds) == has(oldSelf.activeDeadlineSeconds) && (!has(self.activeDeadlineSeconds) || self.activeDeadlineSeconds == oldSelf.activeDeadlineSeconds)'
                  message: activeDeadlineSeconds is immutable
              properties:
                statefulSet: {type: string}
                container: {type: string}
                sourceClusterID: {type: string}
                durability: {type: string}
                recoveryID: {type: string}
                allowDataLoss: {type: boolean}
                maxArchiveAgeSeconds: {type: integer, format: int64}
                anchorID: {type: string}
                fence: {type: object, x-kubernetes-preserve-unknown-fields: true}
                membership: {type: object, x-kubernetes-preserve-unknown-fields: true}
                target:
                  type: object
                  required: [name, uid]
                  x-kubernetes-validations:
                    - rule: '!has(self.namespace)'
                      message: target must be in the request namespace
                  properties:
                    namespace: {type: string}
                    name: {type: string, minLength: 1, maxLength: 253, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'}
                    uid: {type: string, minLength: 1, pattern: '[^\x{0009}-\x{000D}\x{0020}\x{0085}\x{00A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]'}
                expectedGeneration: {type: integer, format: int64, minimum: 0}
                backoffLimit: {type: integer, format: int32, minimum: 0, default: 6}
                activeDeadlineSeconds: {type: integer, format: int64, minimum: 1}
                ttlSecondsAfterFinished:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Mutable request-record retention after Complete or Failed; omitted retains the request. Safety and evidence gates still apply.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
