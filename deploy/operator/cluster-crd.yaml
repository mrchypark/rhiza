apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rhizaclusters.rhiza.mrchypark.dev
spec:
  group: rhiza.mrchypark.dev
  scope: Namespaced
  names:
    plural: rhizaclusters
    singular: rhizacluster
    kind: RhizaCluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [logicalID, statefulSet, container, adoptClusterID, voterPods, automatic, policy]
              properties:
                logicalID:
                  type: string
                  minLength: 1
                statefulSet:
                  type: string
                  minLength: 1
                container:
                  type: string
                  minLength: 1
                adoptClusterID:
                  type: string
                  minLength: 1
                voterPods:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: object
                    required: [nodeID, pod]
                    properties:
                      nodeID: {type: string, minLength: 1}
                      pod: {type: string, minLength: 1}
                automatic:
                  type: boolean
                  description: Explicit consent to fence an unreachable generation even when an observer-only partition might hide a healthy majority. False suspends new incidents, not an already reserved recovery.
                policy:
                  type: object
                  required: [failureGraceSeconds, cooldownSeconds, maxRecoveriesPerDay, allowDataLoss]
                  properties:
                    failureGraceSeconds: {type: integer, minimum: 1, maximum: 86400}
                    cooldownSeconds: {type: integer, minimum: 1, maximum: 604800}
                    maxRecoveriesPerDay: {type: integer, minimum: 1, maximum: 100}
                    allowDataLoss:
                      type: boolean
                      description: Explicitly allow recovery of only the certified archived prefix for an async source. Unarchived acknowledged writes may be lost.
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                activeClusterID: {type: string}
                activeRecovery: {type: string}
                observedGeneration: {type: integer, format: int64}
