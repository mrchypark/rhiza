apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rhizaclusters.rhiza.mrchypark.dev
spec:
  group: rhiza.mrchypark.dev
  scope: Namespaced
  names:
    plural: rhizaclusters
    singular: rhizacluster
    kind: RhizaCluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [logicalID, statefulSet, container, adoptClusterID, voterCount]
              x-kubernetes-validations:
                - rule: "!has(self.automatic) || !self.automatic || has(self.policy)"
                  message: "spec.policy is required when spec.automatic is true"
              properties:
                logicalID:
                  type: string
                  minLength: 1
                statefulSet:
                  type: string
                  minLength: 1
                container:
                  type: string
                  minLength: 1
                adoptClusterID:
                  type: string
                  minLength: 1
                anchorID:
                  type: string
                  description: >-
                    External recovery anchor identifier for automatic child recovery
                    resources. When set, every generated RhizaRecovery inherits this
                    anchorID and the workload must export RHIZA_RECOVERY_ANCHOR_ID.
                voterCount:
                  description: >-
                    Voter count for the source and replacement generation. The
                    StatefulSet must declare the same number of desired replicas.
                    When it exports RHIZA_CLUSTER_MEMBERS, that list must contain
                    the same count and use the Pod names <statefulSet>-<ordinal>.
                    The controller derives those names, the headless-service
                    DNS names, and fresh credentials. The count cannot be changed
                    in place. Generation fencing names every voter plus retained
                    learner history within RhizaFence.spec.targets.maxItems (64).
                  type: integer
                  minimum: 3
                  maximum: 64
                httpPort:
                  description: >-
                    HTTP port used in generated voter URLs. Defaults to 8080.
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 8080
                peerPort:
                  description: >-
                    QUIC peer port used in generated voter URLs. Defaults to 9090.
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 9090
                clusterDomain:
                  description: >-
                    Kubernetes cluster DNS domain used in generated voter URLs.
                    Defaults to cluster.local.
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                  default: cluster.local
                bootstrap:
                  description: >-
                    Generate the initial membership for a workload that exports
                    no RHIZA_CLUSTER_MEMBERS. Defaults to false. The controller
                    refuses bootstrap when the adopted cluster ID already has a
                    membership commitment in object storage.
                  type: boolean
                  default: false
                automatic:
                  type: boolean
                  default: false
                  description: Explicit consent to fence an unreachable generation even when an observer-only partition might hide a healthy majority. False suspends new incidents, not an already reserved recovery.
                policy:
                  type: object
                  description: >-
                    Optional automatic-recovery policy. Required when automatic is true;
                    omitting it keeps new recovery incidents on the explicit RhizaRecovery path.
                  required: [failureGraceSeconds, cooldownSeconds, maxRecoveriesPerDay, allowDataLoss]
                  properties:
                    failureGraceSeconds: {type: integer, minimum: 1, maximum: 86400}
                    cooldownSeconds: {type: integer, minimum: 1, maximum: 604800}
                    maxRecoveriesPerDay: {type: integer, minimum: 1, maximum: 100}
                    allowDataLoss:
                      type: boolean
                      description: Explicitly allow recovery of only the certified archived prefix for an async source. Unarchived acknowledged writes may be lost.
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                activeClusterID: {type: string}
                activeRecovery: {type: string}
                observedGeneration: {type: integer, format: int64}
