apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rhizafences.rhiza.mrchypark.dev
spec:
  group: rhiza.mrchypark.dev
  scope: Namespaced
  names:
    plural: rhizafences
    singular: rhizafence
    kind: RhizaFence
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: fencing requests are immutable
                - rule: '!has(self.bootstrapGenesis) || (self.scope == "Generation" && size(self.targets) > 0)'
                  message: bootstrap genesis fencing requires a captured generation cohort
              required: [logicalID, bindingUID, namespace, statefulSet, statefulSetUID, sourceClusterID, operationID, scope, targets]
              properties:
                logicalID: {type: string, maxLength: 256, minLength: 1}
                bindingUID: {type: string, maxLength: 256, minLength: 1}
                namespace: {type: string, maxLength: 256, minLength: 1}
                statefulSet: {type: string, maxLength: 256, minLength: 1}
                statefulSetUID: {type: string, maxLength: 256, minLength: 1}
                sourceClusterID: {type: string, maxLength: 256, minLength: 1}
                operationID: {type: string, maxLength: 256, minLength: 1}
                scope: {type: string, enum: [Voter, Generation]}
                bootstrapGenesis:
                  type: object
                  required: [version, candidateDigest, clusterName, clusterUID]
                  properties:
                    version: {type: integer, enum: [1]}
                    candidateDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
                    clusterName: {type: string, maxLength: 253, minLength: 1}
                    clusterUID: {type: string, maxLength: 256, minLength: 1}
                targets:
                  description: >-
                    Every voter of the fenced generation plus retained learner
                    history. Keep the voter count comfortably below this bound.
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    required: [nodeID, pod, podUID, walIdentity]
                    properties:
                      nodeID: {type: string, maxLength: 256, minLength: 1}
                      pod: {type: string, maxLength: 256, minLength: 1}
                      podUID: {type: string, maxLength: 256}
                      walIdentity: {type: string, maxLength: 256}
                      nodeName: {type: string, maxLength: 256}
                      nodeUID: {type: string, maxLength: 256}
                      containerID: {type: string, maxLength: 256}
                      imageID: {type: string, maxLength: 256}
            status:
              type: object
              properties:
                proof:
                  type: object
                  required: [operationID, sourceClusterID, bindingUID, requestHash, proofID, processesTerminated, recreationBlocked, storageQuiesced]
                  properties:
                    operationID: {type: string, maxLength: 256, minLength: 1}
                    sourceClusterID: {type: string, maxLength: 256, minLength: 1}
                    bindingUID: {type: string, maxLength: 256, minLength: 1}
                    requestHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                    proofID: {type: string, maxLength: 256, minLength: 1}
                    processesTerminated: {type: boolean}
                    recreationBlocked: {type: boolean}
                    storageQuiesced: {type: boolean}
                    independentV2:
                      description: >-
                        Authority-verified per-run runtime termination. V2 active
                        references include settled producer mutation evidence; V3
                        is reserved for closed pending learners with no producer
                        mutation evidence. Every historical run in the closed
                        cohort is retained; quiet storage observations alone
                        cannot authorize recovery.
                      type: object
                      required: [version, requestHash, ledgerHash, storageScope, currentPodUIDs, terminals]
                      properties:
                        version: {type: integer, enum: [2]}
                        requestHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                        ledgerHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                        storageScope:
                          type: object
                          required: [provider, bucket, prefix]
                          properties:
                            provider: {type: string, maxLength: 256, minLength: 1}
                            endpoint: {type: string, maxLength: 512}
                            bucket: {type: string, maxLength: 256, minLength: 1}
                            prefix: {type: string, maxLength: 1024, minLength: 1}
                            account: {type: string, maxLength: 256}
                            connectionStringDigest: {type: string, maxLength: 64}
                        currentPodUIDs:
                          type: array
                          maxItems: 64
                          items: {type: string, maxLength: 256, minLength: 1}
                        terminals:
                          type: array
                          minItems: 1
                          maxItems: 64
                          items:
                            type: object
                            required: [evidenceVersion, request, runtimeHash, producerUID, proofName, proofUID, proofDigest, runtimeReceiptDigest, mutationReceiptDigest, storageScopeDigest]
                            x-kubernetes-validations:
                              - rule: "(self.evidenceVersion == 2 && size(self.producerUID) > 0 && self.mutationReceiptDigest.matches('^[a-f0-9]{64}$')) || (self.evidenceVersion == 3 && self.producerUID == '' && self.mutationReceiptDigest == '')"
                                message: evidenceVersion 2 requires producer mutation evidence; version 3 is reserved for closed pending learners without a producer
                            properties:
                              evidenceVersion: {type: integer, enum: [2, 3]}
                              request:
                                type: object
                                required: [operationID, requestHash, identity]
                                properties:
                                  operationID: {type: string, maxLength: 256, minLength: 1}
                                  requestHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                                  identity:
                                    type: object
                                    required: [sourceClusterID, nodeID, podUID, runID, walIdentity]
                                    properties:
                                      sourceClusterID: {type: string, maxLength: 256, minLength: 1}
                                      nodeID: {type: string, maxLength: 256, minLength: 1}
                                      podName: {type: string, maxLength: 256}
                                      podUID: {type: string, maxLength: 256, minLength: 1}
                                      runID: {type: string, maxLength: 128, minLength: 1}
                                      walIdentity: {type: string, maxLength: 128}
                                      assignmentID: {type: string, pattern: '^[a-f0-9]{64}$'}
                              runtimeHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                              producerUID: {type: string, maxLength: 128}
                              proofName: {type: string, maxLength: 63, minLength: 1}
                              proofUID: {type: string, maxLength: 128, minLength: 1}
                              proofDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
                              runtimeReceiptDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
                              mutationReceiptDigest: {type: string, maxLength: 64, pattern: '^([a-f0-9]{64})?$'}
                              storageScopeDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
                    independent:
                      description: >-
                        Legacy v1 diagnostic record retained for readability.
                        The authority and recovery controller reject this field
                        as a recovery authorization; new proofs use independentV2.
                      type: object
                      required: [version, provider, mode, observedAt, requestHash, ledgerHash, barrierID, barrier, runtimes, storage]
                      properties:
                        version: {type: integer, enum: [1]}
                        provider: {type: string, maxLength: 256, minLength: 1}
                        mode: {type: string, maxLength: 256, minLength: 1}
                        observedAt: {type: string, maxLength: 64, minLength: 1}
                        requestHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                        ledgerHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                        barrierID: {type: string, maxLength: 256, minLength: 1}
                        barrier:
                          type: object
                          required: [kind, closedOperationID, closedRequestHash, currentPodUIDs, deniedAt]
                          properties:
                            kind: {type: string, maxLength: 256, minLength: 1}
                            closedOperationID: {type: string, maxLength: 256, minLength: 1}
                            closedRequestHash: {type: string, pattern: '^[a-f0-9]{64}$'}
                            currentPodUIDs:
                              type: array
                              maxItems: 64
                              items: {type: string, maxLength: 256, minLength: 1}
                            deniedAt: {type: string, maxLength: 64, minLength: 1}
                        runtimes:
                          description: >-
                            Exactly one terminal entry per fenced Pod incarnation,
                            restating the identity captured before the fault.
                          type: array
                          maxItems: 64
                          items:
                            type: object
                            required: [nodeName, nodeUID, instanceID, podName, podUID, containerIDs, imageIDs, runIDs, walIdentities, state, runtimeEvidence]
                            properties:
                              nodeName: {type: string, maxLength: 256, minLength: 1}
                              nodeUID: {type: string, maxLength: 256, minLength: 1}
                              instanceID: {type: string, maxLength: 256, minLength: 1}
                              podName: {type: string, maxLength: 256, minLength: 1}
                              podUID: {type: string, maxLength: 256, minLength: 1}
                              containerIDs:
                                type: array
                                minItems: 1
                                maxItems: 2
                                items: {type: string, maxLength: 256, minLength: 1}
                              imageIDs:
                                type: array
                                minItems: 1
                                maxItems: 2
                                items: {type: string, maxLength: 256, minLength: 1}
                              runIDs:
                                type: array
                                minItems: 1
                                maxItems: 4
                                items: {type: string, maxLength: 128, minLength: 1}
                              walIdentities:
                                type: array
                                maxItems: 4
                                items: {type: string, maxLength: 128}
                              state: {type: string, enum: [exited, terminated]}
                              runtimeEvidence: {type: string, maxLength: 1024, minLength: 1}
                        storage:
                          description: >-
                            Writer absence and object stability across a quiet
                            window: two observations of archive/head.bin and
                            checkpoint/CURRENT that must agree. It is not a clean
                            engine drain.
                          type: object
                          required: [provider, bucket, prefix, quietWindowSeconds, before, after, stable]
                          properties:
                            provider: {type: string, maxLength: 256, minLength: 1}
                            endpoint: {type: string, maxLength: 512}
                            bucket: {type: string, maxLength: 256, minLength: 1}
                            prefix: {type: string, maxLength: 1024}
                            account: {type: string, maxLength: 256}
                            connectionStringDigest: {type: string, maxLength: 64}
                            quietWindowSeconds: {type: integer, minimum: 30}
                            before: &storageSnapshot
                              type: object
                              required: [observedAt, headGeneration, headMetageneration, currentGeneration, currentMetageneration, inventoryDigest]
                              properties:
                                observedAt: {type: string, maxLength: 32, minLength: 1}
                                headGeneration: {type: string, maxLength: 64, minLength: 1}
                                headMetageneration: {type: string, maxLength: 64, minLength: 1}
                                currentGeneration: {type: string, maxLength: 64, minLength: 1}
                                currentMetageneration: {type: string, maxLength: 64, minLength: 1}
                                inventoryDigest: {type: string, maxLength: 128, minLength: 1}
                            after: *storageSnapshot
                            stable: {type: boolean}
