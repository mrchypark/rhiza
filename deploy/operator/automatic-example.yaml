# Managed reference-host genesis; install the managed overlay and private profile first.
# This does not enable legacy automatic whole-generation disaster recovery.
# Approved automatic-attempt DR remains unimplemented/unqualified; default OFF.
# Submit with strict server-side field validation; it is not DR authority.
apiVersion: rhiza.mrchypark.dev/v1alpha2
kind: RhizaCluster
metadata:
  name: rhiza
  namespace: rhiza
spec:
  logicalID: rhiza-production
  genesisIntent: Create
  applicationProtocol: rhiza-managed-request-append-only/v1
  voterCount: 3
  automaticRecovery: "OFF"
  provisionalRetentionSeconds: 172800
  deletionPolicy: Orphan
  workload:
    podTemplate:
      spec:
        containers:
          - name: app
            image: ghcr.io/mrchypark/rhiza-operator:v0.23.2
