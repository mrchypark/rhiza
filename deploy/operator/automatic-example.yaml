# Apply only after configuring a trusted fencing executor/backend and installing
# cluster-crd.yaml (and fence-crd.yaml for the Kubernetes backend). Durations are explicit deployment choices, not inferred defaults.
# voterCount is the numeric voter count. The StatefulSet must declare the same
# replica count and use Pod names <statefulSet>-<ordinal>. The derived voter
# inventory, headless-service DNS names, and fresh credentials are generated by
# the Operator; voterCount is bounded by the 64-target generation fence.
apiVersion: rhiza.mrchypark.dev/v1alpha1
kind: RhizaCluster
metadata:
  name: rhiza
  namespace: rhiza
spec:
  logicalID: rhiza-production
  statefulSet: rhiza
  container: rhiza
  adoptClusterID: CHANGE_TO_INITIAL_CLUSTER_ID
  voterCount: 3
  # Optional and shown with their defaults:
  httpPort: 8080
  peerPort: 9090
  automatic: false
  policy:
    failureGraceSeconds: 120
    cooldownSeconds: 1800
    maxRecoveriesPerDay: 3
    allowDataLoss: false
