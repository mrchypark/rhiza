# Strategic-merge patch for a NEW generation, never an in-place enrollment of
# an already running/unregistered generation. Supply the normal no-PVC base.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rhiza
  namespace: rhiza
spec:
  template:
    metadata:
      annotations:
        rhiza.mrchypark.dev/cooperative-fencing: "1"
    spec:
      serviceAccountName: rhiza-supervised
      # Bind this workload identity to read/list-only object-store permissions.
      # Source object writes/deletes use the separate rhiza-fencer identity.
      automountServiceAccountToken: false
      hostPID: false
      shareProcessNamespace: false
      containers:
        - name: rhiza
          command: [/usr/local/bin/rhiza-fencer]
          args: [supervise, --, /usr/local/bin/rhiza]
          # Keep only public store coordinates and peer identity; never inject
          # the object-store writer Secret into the voter.
          envFrom:
            - configMapRef:
                name: rhiza-config
            - secretRef:
                name: rhiza-peer-credentials
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: RHIZA_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FENCER_AUTHORITY_URL
              value: https://rhiza-fencer:9444/v1/supervisor
            - name: FENCER_CA_FILE
              value: /fencer-ca/ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: fence-socket
              mountPath: /run/rhiza-fencer
            - name: fence-token
              mountPath: /var/run/secrets/rhiza-fencer
              readOnly: true
            - name: fence-ca
              mountPath: /fencer-ca
              readOnly: true
      volumes:
        - name: temporary
          emptyDir: {}
        - name: fence-socket
          emptyDir: {}
        - name: fence-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: rhiza-fencer
                  expirationSeconds: 600
        - name: fence-ca
          configMap:
            name: rhiza-fencer-ca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhiza-supervised
  namespace: rhiza
automountServiceAccountToken: false
# No RoleBinding: application identities cannot mutate ledgers or fence status.
