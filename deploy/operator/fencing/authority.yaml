apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhiza-fencer
  namespace: rhiza
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhiza-fencer
  namespace: rhiza
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizafences, rhizaclusters]
    verbs: [get, list]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizafences/status]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhiza-fencer
  namespace: rhiza
subjects:
  - kind: ServiceAccount
    name: rhiza-fencer
    namespace: rhiza
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhiza-fencer
---
# TokenReview is cluster-scoped, but grants no Pod/Node mutation permission.
# Install only after explicitly reviewing this permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhiza-fencer-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhiza-fencer-tokenreview
subjects:
  - kind: ServiceAccount
    name: rhiza-fencer
    namespace: rhiza
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhiza-fencer-tokenreview
---
apiVersion: v1
kind: Service
metadata:
  name: rhiza-fencer
  namespace: rhiza
spec:
  selector:
    app.kubernetes.io/name: rhiza-fencer
  ports:
    - name: https
      port: 9444
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhiza-fencer
  namespace: rhiza
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza-fencer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhiza-fencer
    spec:
      serviceAccountName: rhiza-fencer
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authority
          image: rhiza-operator:latest
          command: [/usr/local/bin/rhiza-fencer]
          args: [serve, --tls-cert=/tls/tls.crt, --tls-key=/tls/tls.key]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: 9444
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tls
          secret:
            secretName: rhiza-fencer-tls
