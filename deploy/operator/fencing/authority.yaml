apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhiza-fencer
  namespace: rhiza
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhiza-fencer
  namespace: rhiza
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizaclusters]
    verbs: [get, list]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizarecoveries]
    verbs: [get]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizafences]
    # The authenticated HTTP adapter creates the same immutable RhizaFence
    # record used by the Kubernetes backend; this remains the sole request journal.
    verbs: [get, list, create]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizafences/status]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhiza-fencer
  namespace: rhiza
subjects:
  - kind: ServiceAccount
    name: rhiza-fencer
    namespace: rhiza
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhiza-fencer
---
# TokenReview and namespace UID lookup are cluster-scoped; neither grants
# Pod/Node mutation permission. Install only after reviewing these permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhiza-fencer-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  # The preflight binds a bootstrap candidate to this namespace's live UID.
  # Keep this cluster-scoped lookup pinned to the shipped namespace; renderers
  # for isolated qualification namespaces must rewrite this resourceName.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
    resourceNames: [rhiza]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhiza-fencer-tokenreview
subjects:
  - kind: ServiceAccount
    name: rhiza-fencer
    namespace: rhiza
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhiza-fencer-tokenreview
---
apiVersion: v1
kind: Service
metadata:
  name: rhiza-fencer
  namespace: rhiza
spec:
  selector:
    app.kubernetes.io/name: rhiza-fencer
  ports:
    - name: https
      port: 9444
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhiza-fencer
  namespace: rhiza
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza-fencer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhiza-fencer
    spec:
      serviceAccountName: rhiza-fencer
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authority
          image: rhiza-operator:latest
          command: [/usr/local/bin/rhiza-fencer]
          args: [serve, --tls-cert=/tls/tls.crt, --tls-key=/tls/tls.key, --runtime-agent-ca-file=/runtime-agent-ca/ca.crt]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Legacy RHIZA_FENCE_ATTESTOR_* settings are rejected at startup.
            # This manifest configures the qualified runtime provider only;
            # source-mutation evidence remains a separate required provider.
          ports:
            - name: https
              containerPort: 9444
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: runtime-agent-token
              mountPath: /var/run/secrets/rhiza-fencer
              readOnly: true
            - name: runtime-agent-ca
              mountPath: /runtime-agent-ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tls
          secret:
            secretName: rhiza-fencer-tls
        - name: runtime-agent-token
          projected:
            sources:
              - serviceAccountToken:
                  path: runtime-agent-token
                  audience: rhiza-runtime-agent
                  expirationSeconds: 3600
        - name: runtime-agent-ca
          secret:
            secretName: rhiza-runtime-agent-ca
---
# This profile is deliberately opt-in: the values below must be replaced by
# operator-qualified exact versions/profile IDs before installing the DaemonSet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhiza-runtime-agent-profile
  namespace: rhiza
data:
  containerd-version: QUALIFIED_CONTAINERD_VERSION
  containerd-runtime-type: QUALIFIED_CONTAINERD_RUNTIME_TYPE
  cgroup-profile-id: QUALIFIED_PRIVATE_CGROUP_V2_PROFILE_ID
  kernel-release: QUALIFIED_LINUX_KERNEL_RELEASE
  authority-deployment-uid: PINNED_RHIZA_FENCER_DEPLOYMENT_UID
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhiza-runtime-agent
  namespace: rhiza
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhiza-runtime-agent-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhiza-runtime-agent-tokenreview
subjects:
  - kind: ServiceAccount
    name: rhiza-runtime-agent
    namespace: rhiza
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhiza-runtime-agent-tokenreview
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhiza-runtime-agent-authority-identity
  namespace: rhiza
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhiza-runtime-agent-authority-identity
  namespace: rhiza
subjects:
  - kind: ServiceAccount
    name: rhiza-runtime-agent
    namespace: rhiza
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhiza-runtime-agent-authority-identity
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rhiza-runtime-agent
  namespace: rhiza
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza-runtime-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhiza-runtime-agent
    spec:
      serviceAccountName: rhiza-runtime-agent
      # The runtime agent compares host CRI PIDs with cgroup.procs. Sharing
      # the host PID namespace makes those PID values comparable without
      # granting CAP_SYS_ADMIN or any other Linux capability.
      hostPID: true
      terminationGracePeriodSeconds: 10
      containers:
        - name: runtime-agent
          image: rhiza-operator:latest
          command: [/usr/local/bin/rhiza-runtime-agent]
          args:
            - --cri-socket=/run/containerd/containerd.sock
            - --state-dir=/state/records
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            - --containerd-version=$(CONTAINERD_VERSION)
            - --containerd-runtime-type=$(CONTAINERD_RUNTIME_TYPE)
            - --cgroup-profile-id=$(CGROUP_PROFILE_ID)
            - --kernel-release=$(KERNEL_RELEASE)
            - --authority-deployment-uid=$(AUTHORITY_DEPLOYMENT_UID)
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTAINERD_VERSION
              valueFrom:
                configMapKeyRef:
                  name: rhiza-runtime-agent-profile
                  key: containerd-version
            - name: CONTAINERD_RUNTIME_TYPE
              valueFrom:
                configMapKeyRef:
                  name: rhiza-runtime-agent-profile
                  key: containerd-runtime-type
            - name: CGROUP_PROFILE_ID
              valueFrom:
                configMapKeyRef:
                  name: rhiza-runtime-agent-profile
                  key: cgroup-profile-id
            - name: KERNEL_RELEASE
              valueFrom:
                configMapKeyRef:
                  name: rhiza-runtime-agent-profile
                  key: kernel-release
            - name: AUTHORITY_DEPLOYMENT_UID
              valueFrom:
                configMapKeyRef:
                  name: rhiza-runtime-agent-profile
                  key: authority-deployment-uid
          ports:
            - name: https
              containerPort: 9445
              hostPort: 9445
              protocol: TCP
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cri
              mountPath: /run/containerd/containerd.sock
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: machine-id
              mountPath: /host/etc/machine-id
              readOnly: true
            - name: state
              mountPath: /state
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: cri
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        - name: state
          hostPath:
            path: /var/lib/rhiza-runtime-agent
            type: DirectoryOrCreate
        - name: tls
          secret:
            secretName: rhiza-runtime-agent-tls
