apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhiza-operator
  namespace: rhiza
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhiza-operator
  namespace: rhiza
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    # List is required to fail closed on a same-name CR recreated with a new UID.
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizaclusters]
    # Main-resource update is limited by controller logic to cleanup-finalizer metadata.
    verbs: [get, list, update]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizaclusters/status]
    verbs: [get, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, update]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles]
    # List also finds unlabeled Roles that target this cluster's status.
    verbs: [get, list, create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    # Stale bindings must fail before another UID-scoped binding is created.
    verbs: [get, list, create]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizarecoveries]
    verbs: [get, list, create, update]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizarecoveries/status]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhiza-operator
  namespace: rhiza
subjects:
  - kind: ServiceAccount
    name: rhiza-operator
    namespace: rhiza
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhiza-operator
