apiVersion: v1
kind: Service
metadata:
  name: rhiza-read
  namespace: rhiza
spec:
  selector:
    app.kubernetes.io/name: rhiza
    app.kubernetes.io/component: read-replica
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhiza-object-store-replica
  namespace: rhiza
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza
      app.kubernetes.io/component: read-replica
      rhiza.io/replica-mode: object-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhiza
        app.kubernetes.io/component: read-replica
        rhiza.io/replica-mode: object-store
    spec:
      containers:
        - name: rhiza
          image: rhiza:latest
          envFrom:
            - configMapRef:
                name: rhiza-config
            - secretRef:
                name: rhiza-object-store
          env:
            - name: RHIZA_ROLE
              value: object-store
            - name: RHIZA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhiza-learner
  namespace: rhiza
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza
      app.kubernetes.io/component: read-replica
      rhiza.io/replica-mode: learner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhiza
        app.kubernetes.io/component: read-replica
        rhiza.io/replica-mode: learner
    spec:
      containers:
        - name: rhiza
          image: rhiza:latest
          envFrom:
            - configMapRef:
                name: rhiza-config
            - secretRef:
                name: rhiza-object-store
            - secretRef:
                # Must provide RHIZA_ADMIN_TOKEN and RHIZA_CLUSTER_MEMBERS
                # with each voter's peer_url and token for key derivation.
                name: rhiza-learner-peer-credentials
          env:
            - name: RHIZA_ROLE
              value: learner
            - name: RHIZA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
