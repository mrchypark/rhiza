apiVersion: v1
kind: Namespace
metadata:
  name: rhiza-objstore-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: rhiza-versitygw
  namespace: rhiza-objstore-e2e
type: Opaque
stringData:
  access-key: rhiza-e2e
  secret-key: rhiza-e2e-secret
---
apiVersion: v1
kind: Service
metadata:
  name: rhiza-versitygw
  namespace: rhiza-objstore-e2e
spec:
  selector:
    app: rhiza-versitygw
  ports:
    - name: s3
      port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhiza-versitygw
  namespace: rhiza-objstore-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhiza-versitygw
  template:
    metadata:
      labels:
        app: rhiza-versitygw
    spec:
      containers:
        - name: versitygw
          image: ghcr.io/versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
          args: ["--port", ":9000", "--health", "/_/health", "posix", "/data"]
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rhiza-versitygw
                  key: access-key
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rhiza-versitygw
                  key: secret-key
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /_/health
              port: s3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhiza-create-bucket
  namespace: rhiza-objstore-e2e
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: amazon/aws-cli@sha256:83f8ffe939569070c5b66d22231862ab78718766d9d8e4c44ca84dd0be5569a5
          command: ["/bin/sh", "-c"]
          args:
            - >-
              i=0; while [ "$i" -lt 120 ]; do
              aws --endpoint-url http://rhiza-versitygw:9000 s3api head-bucket --bucket rhiza && exit 0;
              aws --endpoint-url http://rhiza-versitygw:9000 s3 mb s3://rhiza && exit 0;
              i=$((i+1)); sleep 1; done; exit 1
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rhiza-versitygw
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rhiza-versitygw
                  key: secret-key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
