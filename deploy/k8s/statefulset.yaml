apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rhiza
  namespace: rhiza
  labels:
    app.kubernetes.io/name: rhiza
spec:
  serviceName: rhiza-headless
  # Peer protocol changes require an explicit coordinated restart.
  updateStrategy:
    type: OnDelete
    rollingUpdate: null
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhiza
    spec:
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rhiza
      containers:
        - name: rhiza
          image: rhiza:latest
          ports:
            - name: http
              containerPort: 8080
            - name: peer-quic
              containerPort: 9090
              protocol: UDP
          envFrom:
            - configMapRef:
                name: rhiza-config
            # Required private peer identity only; public client auth remains disabled.
            - secretRef:
                name: rhiza-peer-credentials
            - secretRef:
                # Must contain RHIZA_OBJSTORE_BUCKET. Endpoint and credentials
                # are optional when workload identity targets AWS S3 directly.
                name: rhiza-object-store
          env:
            - name: RHIZA_MAX_WAL_BYTES
              value: "4294967296"
            - name: RHIZA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Active DB + online-backup temp + streamed checkpoint temp.
            storage: 64Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rhiza
  namespace: rhiza
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza
