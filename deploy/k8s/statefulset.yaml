apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rhiza
  namespace: rhiza
  labels:
    app.kubernetes.io/name: rhiza
spec:
  serviceName: rhiza-headless
  # Wire/certificate migrations require an explicit coordinated restart.
  updateStrategy:
    type: OnDelete
    rollingUpdate: null
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rhiza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhiza
    spec:
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: rhiza
          image: rhiza:latest
          ports:
            - name: http
              containerPort: 8080
            - name: peer-quic
              containerPort: 9090
              protocol: UDP
          envFrom:
            - configMapRef:
                name: rhiza-config
            # Required private peer identity only; public client auth remains disabled.
            - secretRef:
                name: rhiza-peer-credentials
          env:
            - name: RHIZA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /data
            - name: objstore
              mountPath: /objstore
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: objstore
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
