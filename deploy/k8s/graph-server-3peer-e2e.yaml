apiVersion: v1
kind: Namespace
metadata:
  name: rhiza-graph-3peer-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: rhiza-peer-auth
  namespace: rhiza-graph-3peer-e2e
type: Opaque
stringData:
  token: rhiza-local-e2e-peer-token
---
apiVersion: v1
kind: Service
metadata:
  name: rhiza-graph-headless
  namespace: rhiza-graph-3peer-e2e
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: rhiza-graph-3peer
  ports:
    - name: http
      port: 8080
    - name: peer-quic
      port: 9090
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: rhiza-graph
  namespace: rhiza-graph-3peer-e2e
spec:
  selector:
    app: rhiza-graph-3peer
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rhiza-graph
  namespace: rhiza-graph-3peer-e2e
spec:
  serviceName: rhiza-graph-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
    rollingUpdate: null
  replicas: 3
  selector:
    matchLabels:
      app: rhiza-graph-3peer
  template:
    metadata:
      labels:
        app: rhiza-graph-3peer
    spec:
      containers:
        - name: rhiza-graph
          image: rhiza-e2e:dev
          imagePullPolicy: Never
          env:
            - name: RHIZA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RHIZA_BIND_ADDR
              value: 0.0.0.0:8080
            - name: RHIZA_PEER_ADDR
              value: 0.0.0.0:9090
            - name: RHIZA_DATA_DIR
              value: /data
            - name: RHIZA_CLUSTER_ID
              value: graph-3peer-e2e
            - name: RHIZA_OBJSTORE_PROVIDER
              value: s3
            - name: RHIZA_OBJSTORE_ENDPOINT
              value: rhiza-minio.rhiza-objstore-e2e.svc.cluster.local:9000
            - name: RHIZA_OBJSTORE_BUCKET
              value: rhiza
            - name: RHIZA_OBJSTORE_PREFIX
              value: active
            - name: RHIZA_OBJSTORE_REGION
              value: us-east-1
            - name: RHIZA_OBJSTORE_INSECURE
              value: "true"
            - name: RHIZA_OBJSTORE_ACCESS_KEY
              value: rhiza-e2e
            - name: RHIZA_OBJSTORE_SECRET_KEY
              value: rhiza-e2e-secret
            - name: RHIZA_OBJSTORE_DURABILITY
              value: before-ack
            - name: RHIZA_CHECKPOINT_INTERVAL
              value: 5s
            - name: RHIZA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rhiza-peer-auth
                  key: token
            - name: RHIZA_HEDGE_DELAY
              value: 20ms
            - name: GOMEMLIMIT
              value: 768MiB
            - name: RHIZA_CLUSTER_MEMBERS
              value: >-
                [{"node_id":"rhiza-graph-0","url":"http://rhiza-graph-0.rhiza-graph-headless.rhiza-graph-3peer-e2e.svc.cluster.local:8080","peer_url":"quic://rhiza-graph-0.rhiza-graph-headless.rhiza-graph-3peer-e2e.svc.cluster.local:9090"},{"node_id":"rhiza-graph-1","url":"http://rhiza-graph-1.rhiza-graph-headless.rhiza-graph-3peer-e2e.svc.cluster.local:8080","peer_url":"quic://rhiza-graph-1.rhiza-graph-headless.rhiza-graph-3peer-e2e.svc.cluster.local:9090"},{"node_id":"rhiza-graph-2","url":"http://rhiza-graph-2.rhiza-graph-headless.rhiza-graph-3peer-e2e.svc.cluster.local:8080","peer_url":"quic://rhiza-graph-2.rhiza-graph-headless.rhiza-graph-3peer-e2e.svc.cluster.local:9090"}]
          ports:
            - name: http
              containerPort: 8080
            - name: peer-quic
              containerPort: 9090
              protocol: UDP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
