apiVersion: v1
kind: ConfigMap
metadata:
  name: rhiza-config
  namespace: rhiza
data:
  RHIZA_CLUSTER_ID: "cluster-a"
  RHIZA_BIND_ADDR: "0.0.0.0:8080"
  RHIZA_PEER_ADDR: "0.0.0.0:9090"
  RHIZA_DATA_DIR: "/data"
  # The required rhiza-object-store Secret supplies one shared bucket and,
  # for S3-compatible stores, its endpoint and credentials.
  RHIZA_OBJSTORE_PROVIDER: "s3"
  RHIZA_OBJSTORE_PREFIX: "rhiza"
  RHIZA_CLUSTER_MEMBERS: >-
    [{"node_id":"rhiza-0","url":"http://rhiza-0.rhiza-headless.rhiza.svc.cluster.local:8080","peer_url":"quic://rhiza-0.rhiza-headless.rhiza.svc.cluster.local:9090"},{"node_id":"rhiza-1","url":"http://rhiza-1.rhiza-headless.rhiza.svc.cluster.local:8080","peer_url":"quic://rhiza-1.rhiza-headless.rhiza.svc.cluster.local:9090"},{"node_id":"rhiza-2","url":"http://rhiza-2.rhiza-headless.rhiza.svc.cluster.local:8080","peer_url":"quic://rhiza-2.rhiza-headless.rhiza.svc.cluster.local:9090"}]
