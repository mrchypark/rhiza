[package]
name = "rhizadb"
version = "0.22.1"
edition = "2021"
description = "Embedded Rust SDK for Rhiza via its local Go C archive"
license = "MIT"
repository = "https://github.com/mrchypark/rhiza"
build = "build.rs"
links = "rhiza_ffi"

include = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "build.rs",
    # The HA/operator examples are repository-only CI fixture executables.
    "examples/embedded.rs",
    # Native snapshot preparation/staging requires the repository, not a crate.
    "scripts/fetch-native.sh",
    "src/**",
    "native/**",
]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
