[package]
name = "rhizadb"
version = "0.12.0"
edition = "2021"
description = "Embedded Rust SDK for Rhiza via its local Go C archive"
license = "MIT"
repository = "https://github.com/mrchypark/rhiza"
build = "build.rs"
links = "rhiza_ffi"

include = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "build.rs",
    "examples/**",
    "scripts/**",
    "src/**",
    "native/**",
]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
