name: HA managed kubelet bootstrap
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: internal
            provider: s3
          - fixture: internal
            provider: gcs
          - fixture: internal
            provider: azure
          - fixture: graph
            provider: s3
          - fixture: graph
            provider: gcs
          - fixture: graph
            provider: azure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.32.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Prepare pinned YAML renderer
        shell: sh
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/ha-managed-tools"
          curl --fail --silent --show-error --location --max-time 60 https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -o "$RUNNER_TEMP/ha-managed-tools/yq"
          printf '%s  %s\n' 654d2943ca1d3be2024089eb4f270f4070f491a0610481d128509b2834870049 "$RUNNER_TEMP/ha-managed-tools/yq" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/ha-managed-tools/yq"
          printf '%s\n' "$RUNNER_TEMP/ha-managed-tools" >> "$GITHUB_PATH"
      - name: Static harness checks
        run: |
          sh scripts/test-ha-managed-fixture-profile-selectors.sh
          sh -n scripts/test-ha-managed-bootstrap.sh
          sh -n scripts/ha-managed-bootstrap-fixture.sh
          sh -n scripts/managed-ffi-contract-entrypoint.sh
          sh -n scripts/ha-managed-podchaos.sh
          sh scripts/managed-ffi-contract-entrypoint.sh --diagnostic-self-test
          sh -c '. scripts/ha-managed-bootstrap-fixture.sh; managed_mixed_tuple_self_test'
          sh -c '. scripts/ha-managed-bootstrap-fixture.sh; managed_graph_tuple_self_test'
          sh -c '. scripts/ha-managed-bootstrap-fixture.sh; managed_graph_cabi_self_test'
          sh -n scripts/test-ha-managed-cluster-chaos.sh
          sh scripts/test-ha-managed-cluster-chaos-test.sh
          sh scripts/test-ha-managed-direct-host-chaos-test.sh
          sh scripts/test-ha-managed-cluster-chaos-diagnostics-test.sh
          sh scripts/test-ha-managed-bootstrap.sh --oracle-self-test
          sh -n scripts/ha-managed-bucket-setup
      - name: Real managed bootstrap
        env:
          RHIZA_MANAGED_BUCKET_SETUP: ./scripts/ha-managed-bucket-setup
          RHIZA_MANAGED_TEST_DOCKERFILE: Dockerfile.managed-ffi-contract
          RHIZA_MANAGED_FIXTURE_CASE: ${{ matrix.fixture }}
          RHIZA_MANAGED_FIXTURE_PROVIDER: ${{ matrix.provider }}
        run: sh scripts/test-ha-managed-bootstrap.sh
      - name: Preserve non-secret diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-managed-bootstrap-${{ matrix.fixture }}-${{ matrix.provider }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ha-managed-bootstrap
      - name: Remove owned YAML renderer
        if: always()
        shell: sh
        run: |
          set -eu
          if [ -d "$RUNNER_TEMP/ha-managed-tools" ]; then
            rm -f "$RUNNER_TEMP/ha-managed-tools/yq"
            rmdir "$RUNNER_TEMP/ha-managed-tools"
            test ! -e "$RUNNER_TEMP/ha-managed-tools"
          fi
