name: Release sync

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag, crate version, and registry agree
        run: ./scripts/check-release-sync.sh "$GITHUB_REF_NAME"
