name: HA managed candidate image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main commit, including the chaos harness
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rhiza-candidate-image-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  candidate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact protected-main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -eu
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish run-unique candidate image
        id: image_tag
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rhiza-operator
        run: |
          set -eu
          printf 'image=%s:chaos-%s-%s-%s\n' "$IMAGE_NAME" "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_tag.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=chaos-candidate-${{ inputs.source_sha }}
      - name: Record immutable image provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rhiza-operator
          IMAGE_TAG: ${{ steps.image_tag.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          mkdir -p "$RUNNER_TEMP/candidate-image-provenance"
          printf '{"schema":"rhiza-candidate-image/v1","repository":"%s","source_sha":"%s","workflow_path":".github/workflows/ha-managed-candidate-image.yml","workflow_run_id":%s,"workflow_run_attempt":%s,"image":"%s","tag":"%s","digest":"%s","image_ref":"%s@%s"}\n' \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$IMAGE_NAME" "$IMAGE_TAG" "$IMAGE_DIGEST" "$IMAGE_NAME" "$IMAGE_DIGEST" \
            > "$RUNNER_TEMP/candidate-image-provenance/provenance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ha-candidate-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-image-provenance/provenance.json
          if-no-files-found: error
          retention-days: 14
