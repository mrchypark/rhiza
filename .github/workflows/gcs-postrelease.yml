name: GCS postrelease qualification

# Must first be registered by normal protected main merge; branch dispatch
# cannot bypass that requirement. No PR/push trigger can obtain cloud identity.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Root-approved immutable run ID (no reuse)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gcs-postrelease-v0191
  cancel-in-progress: false

jobs:
  qualification:
    if: github.repository == 'mrchypark/rhiza' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: rhiza-gcs-postrelease
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      RHIZA_APPLICATION_SHA: f4d4cfee6d0928d813e84fe6e7d8c2b01c69f32c
      RHIZA_RUN_ID: ${{ inputs.run_id }}
      RHIZA_NAMESPACE: rhiza-v0191-20261008-${{ inputs.run_id }}
      RHIZA_EXECUTION_GO: ${{ vars.RHIZA_EXECUTION_GO }}
      RHIZA_APPROVED_CAP_KRW: ${{ vars.RHIZA_APPROVED_CAP_KRW }}
      RHIZA_BOOTSTRAP_UID: ${{ vars.RHIZA_BOOTSTRAP_UID }}
      RHIZA_AUTH_CREATION_SHA: ${{ vars.RHIZA_AUTH_CREATION_SHA }}
      RHIZA_NODE_A: ${{ vars.RHIZA_NODE_A }}
      RHIZA_NODE_B: ${{ vars.RHIZA_NODE_B }}
      RHIZA_NODE_C: ${{ vars.RHIZA_NODE_C }}
      RHIZA_METADATA_IMAGE: ${{ vars.RHIZA_METADATA_IMAGE }}
      RHIZA_WIF_PROVIDER: ${{ vars.RHIZA_WIF_PROVIDER }}
      RHIZA_CI_GSA: ${{ vars.RHIZA_CI_GSA }}
    steps:
      - name: Require frozen approval before build/authentication
        shell: bash
        run: |
          set -eu
          [[ "$RHIZA_RUN_ID" =~ ^[a-f0-9]{8}$ ]]
          [[ "$RHIZA_EXECUTION_GO" == "$GITHUB_SHA:$RHIZA_RUN_ID" ]]
          [[ "$RHIZA_AUTH_CREATION_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RHIZA_APPROVED_CAP_KRW" == 10000 ]]
          [[ -n "$RHIZA_BOOTSTRAP_UID" && -n "$RHIZA_NODE_A" && -n "$RHIZA_NODE_B" && -n "$RHIZA_NODE_C" ]]
          [[ "$RHIZA_METADATA_IMAGE" =~ ^gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:[a-f0-9]{64}$ ]]
          [[ "$RHIZA_WIF_PROVIDER" == "projects/602454948273/locations/global/workloadIdentityPools/rhiza-v0191-gcs-$RHIZA_RUN_ID/providers/github" ]] || exit 1
          [[ "$RHIZA_CI_GSA" == "rhiza-v0191-ci-$RHIZA_RUN_ID@patch2-the-new-era.iam.gserviceaccount.com" ]] || exit 1
          printf 'RHIZA_JOB_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f4d4cfee6d0928d813e84fe6e7d8c2b01c69f32c
          path: engine
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Build exact release engine with reviewed test-host overlay
        shell: bash
        env:
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "$RHIZA_APPLICATION_SHA"
          mkdir "$RUNNER_TEMP/host-build"
          cp harness/e2e/chaos/embedded-go/main.go engine/e2e/chaos/embedded-go/main.go
          cp harness/e2e/chaos/embedded-go/counters_test.go engine/e2e/chaos/embedded-go/counters_test.go
          git -C engine diff --exit-code -- . ':!e2e/chaos/embedded-go/main.go' ':!e2e/chaos/embedded-go/counters_test.go'
          (cd engine && RHIZA_RUNTIME_TEST_SCRIPT="$GITHUB_WORKSPACE/harness/e2e/chaos/run-gcs-postrelease.sh" go test ./e2e/chaos/embedded-go && go build -o "$RUNNER_TEMP/host-build/rhiza" ./e2e/chaos/embedded-go)
          { printf 'engine=%s\nharness=%s\n' "$RHIZA_APPLICATION_SHA" "$GITHUB_SHA"; sha256sum engine/e2e/chaos/embedded-go/main.go "$RUNNER_TEMP/host-build/rhiza"; } > "$RUNNER_TEMP/gcs-postrelease-source-pins.txt"
          docker build -f engine/e2e/chaos/Dockerfile --build-arg BINARY=rhiza \
            --label "org.opencontainers.image.source=https://github.com/mrchypark/rhiza" \
            --label "org.opencontainers.image.revision=$RHIZA_APPLICATION_SHA" \
            --label "io.rhiza.qualification.harness=$GITHUB_SHA" \
            -t "ghcr.io/mrchypark/rhiza-sql:gcs-qualification-$GITHUB_RUN_ID" "$RUNNER_TEMP/host-build"
          test "$(docker inspect --format='{{.Size}}' "ghcr.io/mrchypark/rhiza-sql:gcs-qualification-$GITHUB_RUN_ID")" -lt 134217728
      - name: Publish only run-owned qualification image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/mrchypark/rhiza-sql:gcs-qualification-$GITHUB_RUN_ID"
          image=$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/mrchypark/rhiza-sql:gcs-qualification-$GITHUB_RUN_ID")
          [[ "$image" =~ ^ghcr.io/mrchypark/rhiza-sql@sha256:[a-f0-9]{64}$ ]]
          printf 'RHIZA_HOST_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          docker logout ghcr.io
          mkdir "$RUNNER_TEMP/anonymous-docker"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" docker pull "$image"
          # Registry-denied push/pull is a first failure; no broad-token or
          # alternate-package fallback. All release/latest tags remain intact.
          docker buildx imagetools inspect --raw "$image" > "$RUNNER_TEMP/host-manifest.json"
          docker buildx imagetools inspect --raw "$RHIZA_METADATA_IMAGE" > "$RUNNER_TEMP/metadata-manifest.json"
          host_bytes=$(jq -er '[.layers[].size]|add' "$RUNNER_TEMP/host-manifest.json")
          metadata_bytes=$(jq -er '[.layers[].size]|add' "$RUNNER_TEMP/metadata-manifest.json")
          # Three node pulls + push + conservative uncached anonymous pull;
          # metadata runs on one existing node. Other CI transfer is reserved,
          # not hidden inside a claimed strict billing cap.
          printf 'host_compressed=%s\nmetadata_compressed=%s\nplanned_image_transfer=%s\n' \
            "$host_bytes" "$metadata_bytes" "$((5*host_bytes+metadata_bytes))" >> "$RUNNER_TEMP/gcs-postrelease-source-pins.txt"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.RHIZA_WIF_PROVIDER }}
          service_account: ${{ vars.RHIZA_CI_GSA }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3
        with:
          cluster_name: ied-cluster
          location: asia-northeast3
          project_id: patch2-the-new-era
      - name: Normalize only job-local explicit context
        run: |
          set -eu
          current=$(kubectl config current-context)
          wanted=gke_patch2-the-new-era_asia-northeast3_ied-cluster
          if [ "$current" != "$wanted" ]; then kubectl config rename-context "$current" "$wanted"; fi
      - name: One qualification execution, preserve actual first exit
        shell: bash
        env:
          RHIZA_OUTPUT: ${{ runner.temp }}/gcs-postrelease-evidence
        run: |
          set -o pipefail
          sh harness/e2e/chaos/run-gcs-postrelease.sh run 2>&1 | tee "$RUNNER_TEMP/gcs-postrelease-wrapper.log"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gcs-postrelease-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/gcs-postrelease-evidence
            ${{ runner.temp }}/gcs-postrelease-wrapper.log
            ${{ runner.temp }}/gcs-postrelease-source-pins.txt
          if-no-files-found: warn
