name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fencing_only:
        description: Run only the fencing harness and checkpoint/archive regression tests
        type: boolean
        required: false
        default: false
      publish_chaos_image:
        description: Publish the tested qualification host image for a local run
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  fencing-only:
    if: github.event_name == 'workflow_dispatch' && inputs.fencing_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check fencing harness fixtures
        run: FENCING_PROFILE_SELFTEST=1 sh e2e/fencing/run.sh
      - name: Check public fencing artifact fixtures
        env:
          CGO_ENABLED: 1
        run: go test -race ./e2e/fencing -count=1 -timeout=5m
      - name: Check checkpoint adoption and archive regressions
        env:
          CGO_ENABLED: 1
        run: |
          tests='^(TestLearnerHardKillAtAdoptionWALBoundaries|TestLearnerExpiredPinDuringBuildAllowsSuccessorGCAndRestart|TestLearnerExpiredPinAtManifestAllowsSuccessorGCAndRestart|TestCertifiedCheckpointDefersOnlyLivePinCompaction|TestCertifiedCheckpointDefersOnlyHeldGCLockCompaction|TestCheckpointClaimLifecycle.*|TestNodeForegroundCheckpointClaimRetry.*|TestNodeForegroundArchiveBusy.*|TestNodeArchiveGCPhaseTraceFiniteTerminals|TestNodeArchiveExtentAttributionRowGate)$'
          go test -tags rhiza_local_testhooks . ./pkg/node ./pkg/checkpoint -run "$tests" -count=1 -timeout=8m
          go test -race -tags rhiza_local_testhooks . ./pkg/node ./pkg/checkpoint -run "$tests" -count=1 -timeout=8m
      - name: Check archive version-GC races
        env:
          CGO_ENABLED: 1
        run: |
          tests='^(TestArchiveGCVersionDeleteCannotRemoveReplacement|TestRecoveryPinGCDoesNotDeleteConcurrentRenewal|TestRecoveryPinGCKeepsGenerationWithoutReadingExtentChain)$'
          go test -tags rhiza_local_testhooks ./pkg/recovery -run "$tests" -count=1 -timeout=2m
          go test -race -tags rhiza_local_testhooks ./pkg/recovery -run "$tests" -count=1 -timeout=2m

  cooperative-fencing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile all Go tests with local hooks (do not execute)
        run: |
          set -eu
          output_dir="$RUNNER_TEMP/rhiza-compiled-tests"
          package_list="$RUNNER_TEMP/rhiza-test-packages.txt"
          mkdir -p "$output_dir"
          go list -tags rhiza_local_testhooks ./... > "$package_list"
          test -s "$package_list"
          index=0
          compile_failed=0
          while IFS= read -r package; do
            index=$((index + 1))
            binary_name=$(printf '%04d.test' "$index")
            printf 'Compiling test package %s\n' "$package"
            if ! go test -c -tags rhiza_local_testhooks -o "$output_dir/$binary_name" "$package"; then
              compile_failed=1
            fi
          done < "$package_list"
          if [ "$compile_failed" -ne 0 ]; then
            exit 1
          fi
      - name: Check fencing runtime profile validator
        run: FENCING_PROFILE_SELFTEST=1 sh e2e/fencing/run.sh
      - name: Check cooperative protocol and engine regression tests
        run: |
          go test -race ./cmd/rhiza-fencer ./cmd/rhiza-runtime-agent ./pkg/fencing ./pkg/fencing/cri ./pkg/fencing/runtimeagent ./pkg/operator ./pkg/node ./pkg/network ./pkg/recovery ./pkg/materializer ./internal/objstore ./e2e/fencing -count=1 -timeout=5m
      - name: Qualify shipped runtime agent and cooperative executor in disposable Kubernetes
        env:
          CGO_ENABLED: 0
          FENCING_E2E_OUT: cooperative-fencing-results
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          mkdir -p "$RUNNER_TEMP/fencing-images" cooperative-fencing-results
          go build -o "$RUNNER_TEMP/fencing-images/rhiza" ./cmd/rhiza
          go build -o "$RUNNER_TEMP/fencing-images/rhiza-operator" ./cmd/rhiza-operator
          go build -o "$RUNNER_TEMP/fencing-images/rhiza-fencer" ./cmd/rhiza-fencer
          go build -o "$RUNNER_TEMP/fencing-images/rhiza-runtime-agent" ./cmd/rhiza-runtime-agent
          go build -o "$RUNNER_TEMP/fencing-e2e" ./e2e/fencing
          cp "$RUNNER_TEMP/fencing-e2e" "$RUNNER_TEMP/fencing-images/fencing-e2e"
          docker build -f Dockerfile.fencing-test -t rhiza-fencing-host:local -t rhiza-fencing-operator:local "$RUNNER_TEMP/fencing-images"
          if kind get clusters | grep -Fx rhiza-generic-fencing; then exit 1; fi
          FENCING_E2E_BIN="$RUNNER_TEMP/fencing-e2e" sh e2e/fencing/run.sh
      - name: Verify pre-cleanup runtime diagnostics on failure
        if: always()
        run: |
          if test -f cooperative-fencing-results/actual-exit.txt && test "$(cat cooperative-fencing-results/actual-exit.txt)" != 0; then
            test -s cooperative-fencing-results/fencer-diagnostics.json
            test -s cooperative-fencing-results/fencer-pods.json
            test -s cooperative-fencing-results/fencer-events.json
            test -s cooperative-fencing-results/fencer-deployment.json
            test -f cooperative-fencing-results/private-fencer-diagnostics/authority-current.log
          fi
      - name: Prepare allowlisted public fencing evidence
        id: fencing_public
        if: always()
        run: |
          test -x "$RUNNER_TEMP/fencing-e2e"
          FENCING_E2E_OUT=cooperative-fencing-results "$RUNNER_TEMP/fencing-e2e" safe-artifacts
          find cooperative-fencing-results/public -type f ! -name SHA256SUMS -exec sha256sum {} + > cooperative-fencing-results/public/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always() && steps.fencing_public.outcome == 'success'
        with:
          name: cooperative-fencing-${{ github.run_id }}
          path: cooperative-fencing-results/public
      - name: Remove only this job's test cluster
        if: always()
        run: |
          if test -f cooperative-fencing-results/owned-cluster.txt && command -v kind >/dev/null 2>&1; then
            if kind get clusters | grep -Fx rhiza-generic-fencing; then
              kind delete cluster --name rhiza-generic-fencing
            fi
            if kind get clusters | grep -Fx rhiza-generic-fencing; then exit 1; fi
          fi

  operator-chaos:
    if: github.event_name != 'workflow_dispatch' || !inputs.fencing_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build test images and Kubernetes cluster
        env:
          CGO_ENABLED: 0
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          mkdir -p "$RUNNER_TEMP/chaos-images"
          go build -o "$RUNNER_TEMP/chaos-images/rhiza" ./cmd/rhiza
          go build -o "$RUNNER_TEMP/chaos-images/operator" ./cmd/rhiza-operator
          docker build -f e2e/chaos/Dockerfile --build-arg BINARY=rhiza -t rhiza-chaos:local "$RUNNER_TEMP/chaos-images"
          docker build -f e2e/chaos/Dockerfile --build-arg BINARY=operator -t rhiza-operator-chaos:local "$RUNNER_TEMP/chaos-images"
          kind create cluster --name rhiza-operator-chaos --wait 120s
          kind load docker-image rhiza-chaos:local rhiza-operator-chaos:local --name rhiza-operator-chaos
      - name: Inject faults and verify Operator recovery
        run: python3 -u e2e/chaos/operator_recovery.py
      - name: Collect cluster diagnostics
        if: always()
        run: kind export logs operator-chaos-results/kind --name rhiza-operator-chaos || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-chaos-${{ github.run_id }}
          path: |
            operator-chaos-results
            !operator-chaos-results/kind/**
      - name: Remove test cluster
        if: always()
        run: kind delete cluster --name rhiza-operator-chaos

  automatic-operator-chaos:
    if: github.event_name != 'workflow_dispatch' || !inputs.fencing_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [server, go, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.host == 'rust'
      - name: Fencing executor regression checks
        run: python3 e2e/chaos/kind_fencer_test.py
      - name: Build test images and Kubernetes cluster
        env:
          CGO_ENABLED: 0
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          mkdir -p "$RUNNER_TEMP/chaos-images"
          case "${{ matrix.host }}" in
            server) go build -o "$RUNNER_TEMP/chaos-images/rhiza" ./cmd/rhiza ;;
            go) go build -o "$RUNNER_TEMP/chaos-images/rhiza" ./e2e/chaos/embedded-go ;;
            rust)
              cargo build --manifest-path sdk/rust/Cargo.toml --locked --example operator_chaos
              cp sdk/rust/target/debug/examples/operator_chaos "$RUNNER_TEMP/chaos-images/rhiza"
              ;;
          esac
          go build -o "$RUNNER_TEMP/chaos-images/operator" ./cmd/rhiza-operator
          if [[ "${{ matrix.host }}" == rust ]]; then
            docker build -f e2e/chaos/Dockerfile.rust -t rhiza-chaos:local "$RUNNER_TEMP/chaos-images"
          else
            docker build -f e2e/chaos/Dockerfile --build-arg BINARY=rhiza -t rhiza-chaos:local "$RUNNER_TEMP/chaos-images"
          fi
          docker build -f e2e/chaos/Dockerfile --build-arg BINARY=operator -t rhiza-operator-chaos:local "$RUNNER_TEMP/chaos-images"
          kind create cluster --name rhiza-operator-chaos --wait 120s
          kind load docker-image rhiza-chaos:local rhiza-operator-chaos:local --name rhiza-operator-chaos
      - name: Inject faults and verify unattended Operator recovery
        run: python3 -u e2e/chaos/automatic_recovery.py --embedded-host "${{ matrix.host }}"
      - name: Collect cluster diagnostics
        if: always()
        run: kind export logs automatic-chaos-results/kind --name rhiza-operator-chaos || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-operator-chaos-${{ matrix.host }}-${{ github.run_id }}
          path: |
            automatic-chaos-results
            !automatic-chaos-results/kind/**
      - name: Remove test cluster
        if: always()
        run: kind delete cluster --name rhiza-operator-chaos
  membership-e2e:
    if: github.event_name != 'workflow_dispatch' || !inputs.fencing_only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Membership lifecycle with real QUIC and object storage
        env:
          CGO_ENABLED: 1
          RHIZA_E2E_S3_ENDPOINT: 127.0.0.1:19000
          RHIZA_E2E_S3_BUCKET: rhiza
          RHIZA_E2E_S3_ACCESS_KEY: rhiza-e2e
          RHIZA_E2E_S3_SECRET_KEY: rhiza-e2e-secret
          AWS_ACCESS_KEY_ID: rhiza-e2e
          AWS_SECRET_ACCESS_KEY: rhiza-e2e-secret
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_PAGER: ""
        run: |
          aws_path=$(command -v aws)
          aws_version=$(aws --version 2>&1)
          runner_arch=$(uname -m)
          test "$runner_arch" = x86_64
          case "$aws_version" in
            aws-cli/2.*Linux*exe/x86_64.*) ;;
            *) echo "unsupported runner AWS CLI: $aws_version" >&2; exit 1 ;;
          esac
          printf 'command=%s\nversion=%s\narchitecture=%s\n' \
            "$aws_path" "$aws_version" "$runner_arch" \
            | tee "$RUNNER_TEMP/rhiza-membership-aws-cli-receipt.txt"
          mkdir -p "$RUNNER_TEMP/rhiza-s3-data"
          docker run --rm -d --name rhiza-membership-s3 -p 19000:9000 \
            -v "$RUNNER_TEMP/rhiza-s3-data:/data" \
            -e ROOT_ACCESS_KEY=rhiza-e2e -e ROOT_SECRET_KEY=rhiza-e2e-secret \
            ghcr.io/versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port :9000 --health /_/health posix /data
          trap 'docker logs rhiza-membership-s3; docker rm -f rhiza-membership-s3' EXIT
          for _ in {1..100}; do
            curl -fsS http://127.0.0.1:19000/_/health >/dev/null 2>&1 && break
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:19000/_/health >/dev/null
          (
            set +x
            ambient_auth_vars=(
              AWS_PROFILE AWS_DEFAULT_PROFILE AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
              AWS_WEB_IDENTITY_TOKEN_FILE AWS_ROLE_ARN AWS_ROLE_SESSION_NAME
              AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI
              AWS_CONTAINER_AUTHORIZATION_TOKEN AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE
              AWS_CREDENTIAL_PROCESS AWS_SDK_LOAD_CONFIG
            )
            unset "${ambient_auth_vars[@]}"
            for auth_var in "${ambient_auth_vars[@]}"; do
              if test -n "${!auth_var+x}"; then
                printf 'failed to isolate ambient AWS auth selector: %s\n' "$auth_var" >&2
                exit 1
              fi
            done

            auth_dir=$(mktemp -d "$RUNNER_TEMP/rhiza-membership-aws-auth.XXXXXX")
            config_file="$auth_dir/config"
            credentials_file="$auth_dir/credentials"
            # Invoked indirectly by the EXIT trap below.
            # shellcheck disable=SC2329
            cleanup_aws_auth() {
              status=$?
              trap - EXIT
              rm -f -- "$config_file" "$credentials_file" || :
              rmdir -- "$auth_dir" || :
              exit "$status"
            }
            trap cleanup_aws_auth EXIT
            export AWS_CONFIG_FILE="$config_file"
            export AWS_SHARED_CREDENTIALS_FILE="$credentials_file"
            umask 077
            : >"$AWS_SHARED_CREDENTIALS_FILE"
            chmod 600 "$AWS_SHARED_CREDENTIALS_FILE"
            printf '[default]\ns3 =\n  addressing_style = path\n' >"$AWS_CONFIG_FILE"
            chmod 600 "$AWS_CONFIG_FILE"
            test ! -s "$AWS_SHARED_CREDENTIALS_FILE"

            aws --endpoint-url http://127.0.0.1:19000 s3 mb s3://rhiza
          )
          go test -race . -run '^TestS3(Membership|VoterIdentity)' -count=1 -timeout=8m

  rust-sdk:
    if: github.event_name != 'workflow_dispatch' || !inputs.fencing_only
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
      GOEXPERIMENT: cgocheck2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: FFI lifecycle and concurrency
        run: go test -race ./cmd/rhiza-ffi
      - name: Rust format
        run: cargo fmt --manifest-path sdk/rust/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path sdk/rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Embedded Rust integration
        run: cargo test --manifest-path sdk/rust/Cargo.toml --locked --all-targets
      - name: Standalone crates.io package
        run: |
          sh sdk/rust/scripts/prepare-native.sh
          cargo package --manifest-path sdk/rust/Cargo.toml --locked --allow-dirty
          crate_version=$(cargo metadata --manifest-path sdk/rust/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[0].version')
          crate_bytes=$(wc -c < "sdk/rust/target/package/rhizadb-$crate_version.crate" | tr -d ' ')
          echo "packaged crate: $crate_bytes bytes of the 10000000 byte crates.io limit"
          [ "$crate_bytes" -le 10000000 ] || { echo "the packaged crate exceeds the crates.io limit"; exit 1; }
          cargo test --manifest-path "sdk/rust/target/package/rhizadb-$crate_version/Cargo.toml" --locked --all-targets

  go:
    if: github.event_name != 'workflow_dispatch' || !inputs.fencing_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        env:
          CGO_ENABLED: 0
        run: go test ./...
      - name: Bucket fixture retry regression
        run: |
          python3 e2e/chaos/operator_fixture_test.py
          python3 e2e/chaos/operator_recovery_test.py
      - name: voterCount GCS/Chaos harness contract
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.3'
          python3 e2e/chaos/votercount_gcs_chaos_test.py
      - name: Learner checkpoint adoption crash and lease boundaries
        env:
          CGO_ENABLED: 1
        run: >-
          go test -tags rhiza_local_testhooks .
          -run '^(TestLearnerHardKillAtAdoptionWALBoundaries|TestLearnerExpiredPinDuringBuildAllowsSuccessorGCAndRestart|TestLearnerExpiredPinAtManifestAllowsSuccessorGCAndRestart)$'
          -count=1 -timeout=8m
      - name: Learner checkpoint adoption crash and lease boundaries (race)
        env:
          CGO_ENABLED: 1
        run: >-
          go test -race -tags rhiza_local_testhooks .
          -run '^(TestLearnerHardKillAtAdoptionWALBoundaries|TestLearnerExpiredPinDuringBuildAllowsSuccessorGCAndRestart|TestLearnerExpiredPinAtManifestAllowsSuccessorGCAndRestart)$'
          -count=1 -timeout=8m
      - name: Node foreground certified GC preparation and attribution
        env:
          CGO_ENABLED: 1
        run: >-
          go test -tags rhiza_local_testhooks ./pkg/node ./pkg/checkpoint ./pkg/network
          -run '^(TestNodeForegroundCertifiedGCPreparationRequiresRealSealAndCurrent|TestNodeForegroundPreparationUsesFreshCanceledContexts|TestNodeForegroundPreparationDeadlineBridge|TestNodeArchiveExtentAttributionRowGate|TestNodeForegroundPublisherBusyCollectorBoundsConcurrentEvents|TestNodeForegroundArchiveBusy.*|TestNodeForegroundRecoveryPin.*|TestNodeForegroundOverloadSiteCollectorCountsFixedNames|TestCheckpointClaimLifecycle.*|TestNodeForegroundClaimLifecycle.*|TestNodeForegroundCheckpointClaimRetry.*|TestNodeForegroundBatchAdmissionCollectorAggregatesConcurrentEvents|TestInternalBatchAdmissionTaggedObserverAndDirectControlIsolation)$'
          -count=1 -timeout=1m
      - name: Node foreground certified GC preparation and attribution (race)
        env:
          CGO_ENABLED: 1
        run: >-
          go test -race -tags rhiza_local_testhooks ./pkg/node ./pkg/checkpoint
          -run '^(TestNodeForegroundCertifiedGCPreparationRequiresRealSealAndCurrent|TestNodeForegroundPreparationUsesFreshCanceledContexts|TestNodeForegroundPreparationDeadlineBridge|TestNodeArchiveExtentAttributionRowGate|TestNodeForegroundPublisherBusyCollectorBoundsConcurrentEvents|TestNodeForegroundArchiveBusy.*|TestNodeForegroundRecoveryPin.*|TestNodeForegroundOverloadSiteCollectorCountsFixedNames|TestCheckpointClaimLifecycle.*|TestNodeForegroundClaimLifecycle.*|TestNodeForegroundCheckpointClaimRetry.*)$'
          -count=1 -timeout=1m
      - name: Terminal decision handshake cancellation
        env:
          CGO_ENABLED: 1
        run: |
          go test -tags rhiza_local_testhooks ./pkg/network -run '^TestTerminalDecisionCancelsUnneededPeerHandshake$' -count=1 -timeout=30s
          go test -tags rhiza_local_testhooks ./pkg/network -run '^TestOverload(MutationAdmissionEmitsFixedSite|QueueReservationEmitsFixedSite|InputChannelFullEmitsFixedSite|WorkerInflightBytesEmitsFixedSite|ProposalAdmissionSubtypeEmitsFixedSite)$' -count=1 -timeout=30s
          go test -tags rhiza_local_testhooks ./pkg/node -run '^TestAdvanceCheckpointReadBarriersRetriesRealPreAdmissionRefusal$' -count=1 -timeout=30s
          go test -tags rhiza_local_testhooks ./pkg/recovery -run '^(TestArchiveCleanupReusesUnchangedPrefixAfterRealHeadConflict|TestArchiveCleanupReuseRequiresExactBaseAndRefPrefix|TestArchiveCleanupIncrementalPackingMatchesFullAtBoundaries|TestArchiveCleanupAmbiguousPublicationReloadsCommittedHead|TestArchiveCleanupCanceledAfterHeadConflictDoesNotRepublish)$' -count=1 -timeout=2m
      - name: Terminal decision handshake cancellation (race)
        env:
          CGO_ENABLED: 1
        run: |
          go test -race -tags rhiza_local_testhooks ./pkg/network -run '^TestTerminalDecisionCancelsUnneededPeerHandshake$' -count=1 -timeout=30s
          go test -race -tags rhiza_local_testhooks ./pkg/network -run '^TestOverload(MutationAdmissionEmitsFixedSite|QueueReservationEmitsFixedSite|InputChannelFullEmitsFixedSite|WorkerInflightBytesEmitsFixedSite|ProposalAdmissionSubtypeEmitsFixedSite)$' -count=1 -timeout=30s
          go test -race -tags rhiza_local_testhooks ./pkg/node -run '^TestAdvanceCheckpointReadBarriersRetriesRealPreAdmissionRefusal$' -count=1 -timeout=30s
          go test -race -tags rhiza_local_testhooks ./pkg/recovery -run '^(TestArchiveCleanupReusesUnchangedPrefixAfterRealHeadConflict|TestArchiveCleanupReuseRequiresExactBaseAndRefPrefix|TestArchiveCleanupIncrementalPackingMatchesFullAtBoundaries|TestArchiveCleanupAmbiguousPublicationReloadsCommittedHead|TestArchiveCleanupCanceledAfterHeadConflictDoesNotRepublish)$' -count=1 -timeout=2m
      - name: Vet
        env:
          CGO_ENABLED: 0
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build ./cmd/rhiza ./cmd/rhiza-operator

      - name: Real server E2E
        env:
          CGO_ENABLED: 0
          RHIZA_BIND_ADDR: 127.0.0.1:18086
          RHIZA_PEER_ADDR: 127.0.0.1:19086
          RHIZA_DATA_DIR: ${{ runner.temp }}/rhiza-e2e
          RHIZA_E2E_URL: http://127.0.0.1:18086
        run: |
          go build -o "$RUNNER_TEMP/rhiza" ./cmd/rhiza
          "$RUNNER_TEMP/rhiza" >"$RUNNER_TEMP/rhiza-e2e.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            if curl --fail --silent "$RHIZA_E2E_URL/ready" >/dev/null; then
              go test -count=1 ./e2e -run '^TestSQLServer$'
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/rhiza-e2e.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$RUNNER_TEMP/rhiza-e2e.log"
          exit 1

      - name: Race detector
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  containers:
    if: github.event_name != 'workflow_dispatch' || !inputs.fencing_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare container test tools
        run: |
          awk '
            { print }
            $0 == "FROM mirror.gcr.io/library/golang:1.27.3-alpine@sha256:f2c872bcee949b7be9c490efd02b48a8a2fbf947cdf533f1c58525ec9d8170fd AS builder" {
              print "RUN apk --no-cache add jq coreutils"
              matched++
            }
            END { if (matched != 1) exit 1 }
          ' Dockerfile > "$RUNNER_TEMP/Dockerfile.ci"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile.ci
          push: false
          tags: rhiza:ci

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.operator
          push: false
          tags: rhiza-operator:ci

  anchor-operator-chaos:
    if: github.event_name != 'workflow_dispatch' || !inputs.fencing_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH_CHAOS_IMAGE: ${{ github.repository == 'mrchypark/rhiza' && github.event_name == 'workflow_dispatch' && inputs.publish_chaos_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Require exact candidate source for image export
        if: env.PUBLISH_CHAOS_IMAGE == 'true'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build test images and Kubernetes cluster
        env:
          CGO_ENABLED: 0
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          mkdir -p "$RUNNER_TEMP/chaos-images"
          go build -o "$RUNNER_TEMP/chaos-images/rhiza" ./e2e/chaos/embedded-go
          go build -o "$RUNNER_TEMP/chaos-images/operator" ./cmd/rhiza-operator
          go build -o "$RUNNER_TEMP/chaos-images/anchor-service" ./examples/recovery-anchor
          labels=()
          if [ "$PUBLISH_CHAOS_IMAGE" = true ]; then
            labels=(--label "org.opencontainers.image.source=https://github.com/mrchypark/rhiza"
              --label "org.opencontainers.image.revision=$GITHUB_SHA"
              --label "io.rhiza.qualification.harness=$GITHUB_SHA"
              --label "io.rhiza.qualification.application=$GITHUB_SHA")
          fi
          docker build -f e2e/chaos/Dockerfile --build-arg BINARY=rhiza "${labels[@]}" -t rhiza-chaos:local "$RUNNER_TEMP/chaos-images"
          docker build -f e2e/chaos/Dockerfile --build-arg BINARY=operator -t rhiza-operator-chaos:local "$RUNNER_TEMP/chaos-images"
          docker build -f e2e/chaos/Dockerfile --build-arg BINARY=anchor-service -t rhiza-anchor-service:local "$RUNNER_TEMP/chaos-images"
          kind create cluster --name rhiza-anchor-chaos --wait 120s
          kind load docker-image rhiza-chaos:local rhiza-operator-chaos:local rhiza-anchor-service:local --name rhiza-anchor-chaos
      - name: Fencing executor regression checks
        run: python3 e2e/chaos/kind_fencer_test.py
      - name: Inject faults and verify anchor-gated recovery
        run: python3 -u e2e/chaos/anchor_recovery.py --embedded-host go
      - name: Collect cluster diagnostics
        if: always()
        run: kind export logs anchor-chaos-results/kind --name rhiza-anchor-chaos || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anchor-operator-chaos-${{ github.run_id }}
          path: |
            anchor-chaos-results
            !anchor-chaos-results/kind/**
      - name: Remove test cluster
        if: always()
        run: kind delete cluster --name rhiza-anchor-chaos
      - name: Export the tested qualification host
        if: env.PUBLISH_CHAOS_IMAGE == 'true'
        run: |
          export_dir="$RUNNER_TEMP/qualification-host"
          mkdir -p "$export_dir"
          docker image inspect rhiza-chaos:local > "$export_dir/image.json"
          jq -e --arg revision "$GITHUB_SHA" '
            .[0] | .Os == "linux" and .Architecture == "amd64" and .Size < 134217728 and
            .Config.User == "65532:65532" and
            .Config.Labels["org.opencontainers.image.source"] == "https://github.com/mrchypark/rhiza" and
            .Config.Labels["org.opencontainers.image.revision"] == $revision and
            .Config.Labels["io.rhiza.qualification.harness"] == $revision and
            .Config.Labels["io.rhiza.qualification.application"] == $revision
          ' "$export_dir/image.json"
          container=$(docker create rhiza-chaos:local)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/rhiza-entrypoint" "$export_dir/rhiza-entrypoint"
          cmp "$RUNNER_TEMP/chaos-images/rhiza" "$export_dir/rhiza-entrypoint"
          (cd "$export_dir" && sha256sum rhiza-entrypoint > binary.sha256)
          rm "$export_dir/rhiza-entrypoint"
          docker save rhiza-chaos:local -o "$export_dir/host.tar"
          (cd "$export_dir" && sha256sum host.tar image.json binary.sha256 > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH_CHAOS_IMAGE == 'true'
        with:
          name: qualification-host-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-host
          if-no-files-found: error
          retention-days: 7

  publish-chaos-image:
    if: github.repository == 'mrchypark/rhiza' && github.event_name == 'workflow_dispatch' && inputs.publish_chaos_image && !inputs.fencing_only
    needs: [anchor-operator-chaos, go, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qualification-host-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-host
      - name: Verify and load the tested host image
        working-directory: qualification-host
        run: |
          sha256sum -c SHA256SUMS
          docker load -i host.tar
          test "$(docker image inspect rhiza-chaos:local --format '{{.Id}}')" = "$(jq -r '.[0].Id' image.json)"
          container=$(docker create rhiza-chaos:local)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/rhiza-entrypoint" rhiza-entrypoint
          sha256sum -c binary.sha256
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the immutable run tag
        shell: bash
        run: |
          target="ghcr.io/mrchypark/rhiza-sql:ci-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag rhiza-chaos:local "$target"
          docker push "$target" | tee qualification-host/push.log
          docker image inspect "$target" > qualification-host/published-image.json
          # shellcheck disable=SC2016 # Markdown backticks are literal output.
          printf 'Qualification host: `%s`\n\n' "$target" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[0].RepoDigests[]' qualification-host/published-image.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-publication-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification-host/image.json
            qualification-host/binary.sha256
            qualification-host/SHA256SUMS
            qualification-host/push.log
            qualification-host/published-image.json
          if-no-files-found: error
          retention-days: 7
