name: CI

on:
  push:
    branches: [main, feature/ha-node-prepared-restore]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedded-object-storage-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Qualify embedded storage against all three pinned Floci providers
        env:
          RHIZA_EMBEDDED_FFI_REQUIRED: "1"
        shell: bash
        run: |
          unset RHIZA_EMBEDDED_TEST_PATTERN
          sh scripts/test-embedded-object-providers-contract.sh
          sh scripts/test-embedded-object-providers.sh 2>&1 | tee "$RUNNER_TEMP/embedded-object-storage-providers.log"
      - name: Preserve provider qualification logs and failure diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-object-storage-providers-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/embedded-object-storage-providers.log
            /tmp/rhiza-embedded-providers.*/*.log
            /tmp/rhiza-embedded-providers.*/*-image-digests.json
            /tmp/rhiza-embedded-providers.*/selected-tests.txt
            ${{ runner.temp }}/rhiza-embedded-ffi.*/*

  legacy-recovery-rejection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Retain fencing protocol and engine regressions
        run: go test -race ./pkg/fencing ./pkg/operator ./pkg/node ./pkg/network ./internal/objstore ./e2e/fencing -count=1 -timeout=5m
      - name: Reject unsupported legacy recovery before side effects
        run: |
          go test ./cmd/rhiza-operator -run '^TestPhase9InitializerRejectsLegacyAutomaticRecoveryBeforeKubernetes$' -count=1 -timeout=60s
          go test ./pkg/operator -run '^TestPhase1ControllerRunUnavailable(BeforeSideEffects|WithNilConfiguration)$' -count=1 -timeout=60s

  membership-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Membership lifecycle with real QUIC and object storage
        env:
          CGO_ENABLED: 1
          RHIZA_E2E_S3_ENDPOINT: 127.0.0.1:19000
          RHIZA_E2E_S3_BUCKET: rhiza
          RHIZA_E2E_S3_ACCESS_KEY: rhiza-e2e
          RHIZA_E2E_S3_SECRET_KEY: rhiza-e2e-secret
          AWS_ACCESS_KEY_ID: rhiza-e2e
          AWS_SECRET_ACCESS_KEY: rhiza-e2e-secret
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_PAGER: ""
        run: |
          aws_path=$(command -v aws)
          aws_version=$(aws --version 2>&1)
          runner_arch=$(uname -m)
          test "$runner_arch" = x86_64
          case "$aws_version" in
            aws-cli/2.*Linux*exe/x86_64.*) ;;
            *) echo "unsupported runner AWS CLI: $aws_version" >&2; exit 1 ;;
          esac
          printf 'command=%s\nversion=%s\narchitecture=%s\n' \
            "$aws_path" "$aws_version" "$runner_arch" \
            | tee "$RUNNER_TEMP/rhiza-membership-aws-cli-receipt.txt"
          mkdir -p "$RUNNER_TEMP/rhiza-s3-data"
          docker run --rm -d --name rhiza-membership-s3 -p 19000:9000 \
            -v "$RUNNER_TEMP/rhiza-s3-data:/data" \
            -e ROOT_ACCESS_KEY=rhiza-e2e -e ROOT_SECRET_KEY=rhiza-e2e-secret \
            ghcr.io/versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port :9000 --health /_/health posix /data
          trap 'docker logs rhiza-membership-s3; docker rm -f rhiza-membership-s3' EXIT
          for _ in {1..100}; do
            curl -fsS http://127.0.0.1:19000/_/health >/dev/null 2>&1 && break
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:19000/_/health >/dev/null
          (
            set +x
            ambient_auth_vars=(
              AWS_PROFILE AWS_DEFAULT_PROFILE AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
              AWS_WEB_IDENTITY_TOKEN_FILE AWS_ROLE_ARN AWS_ROLE_SESSION_NAME
              AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI
              AWS_CONTAINER_AUTHORIZATION_TOKEN AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE
              AWS_CREDENTIAL_PROCESS AWS_SDK_LOAD_CONFIG
            )
            unset "${ambient_auth_vars[@]}"
            for auth_var in "${ambient_auth_vars[@]}"; do
              if test -n "${!auth_var+x}"; then
                printf 'failed to isolate ambient AWS auth selector: %s\n' "$auth_var" >&2
                exit 1
              fi
            done

            auth_dir=$(mktemp -d "$RUNNER_TEMP/rhiza-membership-aws-auth.XXXXXX")
            config_file="$auth_dir/config"
            credentials_file="$auth_dir/credentials"
            # Invoked indirectly by the EXIT trap below.
            # shellcheck disable=SC2329
            cleanup_aws_auth() {
              status=$?
              trap - EXIT
              rm -f -- "$config_file" "$credentials_file" || :
              rmdir -- "$auth_dir" || :
              exit "$status"
            }
            trap cleanup_aws_auth EXIT
            export AWS_CONFIG_FILE="$config_file"
            export AWS_SHARED_CREDENTIALS_FILE="$credentials_file"
            umask 077
            : >"$AWS_SHARED_CREDENTIALS_FILE"
            chmod 600 "$AWS_SHARED_CREDENTIALS_FILE"
            printf '[default]\ns3 =\n  addressing_style = path\n' >"$AWS_CONFIG_FILE"
            chmod 600 "$AWS_CONFIG_FILE"
            test ! -s "$AWS_SHARED_CREDENTIALS_FILE"

            aws --endpoint-url http://127.0.0.1:19000 s3 mb s3://rhiza
          )
          go test -race . -run '^TestS3(Membership|VoterIdentity)' -count=1 -timeout=8m

  rust-sdk:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
      GOEXPERIMENT: cgocheck2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: FFI lifecycle and concurrency
        run: go test -race ./cmd/rhiza-ffi
      - name: Rust format
        run: cargo fmt --manifest-path sdk/rust/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path sdk/rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Embedded Rust integration
        run: cargo test --manifest-path sdk/rust/Cargo.toml --locked --all-targets
      - name: Standalone crates.io package
        run: |
          sh sdk/rust/scripts/prepare-native.sh
          cargo package --manifest-path sdk/rust/Cargo.toml --locked --allow-dirty
          crate_version=$(cargo metadata --manifest-path sdk/rust/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[0].version')
          crate_bytes=$(wc -c < "sdk/rust/target/package/rhizadb-$crate_version.crate" | tr -d ' ')
          echo "packaged crate: $crate_bytes bytes of the 10000000 byte crates.io limit"
          [ "$crate_bytes" -le 10000000 ] || { echo "the packaged crate exceeds the crates.io limit"; exit 1; }
          cargo test --manifest-path "sdk/rust/target/package/rhizadb-$crate_version/Cargo.toml" --locked --all-targets

  go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GNU timeout 9.12
        env:
          COREUTILS_VERSION: '9.12'
          COREUTILS_SHA256: a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210
        run: |
          archive="$RUNNER_TEMP/coreutils-$COREUTILS_VERSION.tar.xz"
          curl --fail --location --retry 3 --max-time 120 \
            "https://ftp.gnu.org/gnu/coreutils/coreutils-$COREUTILS_VERSION.tar.xz" -o "$archive"
          printf '%s  %s\n' "$COREUTILS_SHA256" "$archive" | sha256sum --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/coreutils-$COREUTILS_VERSION"
          ./configure --disable-nls --without-libgmp
          make -j2
          install -D src/timeout "$RUNNER_TEMP/gnu-timeout/bin/timeout"
          "$RUNNER_TEMP/gnu-timeout/bin/timeout" --version
          echo "$RUNNER_TEMP/gnu-timeout/bin" >> "$GITHUB_PATH"
      - name: Test
        env:
          CGO_ENABLED: 0
        run: go test ./...
      - name: Bucket fixture retry regression
        run: |
          python3 e2e/chaos/operator_fixture_test.py
          python3 e2e/chaos/operator_recovery_test.py
      - name: voterCount GCS/Chaos harness contract
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.3'
          python3 e2e/chaos/votercount_gcs_chaos_test.py
      - name: Learner checkpoint adoption crash and lease boundaries
        env:
          CGO_ENABLED: 1
        run: >-
          go test -tags rhiza_local_testhooks .
          -run '^(TestLearnerHardKillAtAdoptionWALBoundaries|TestLearnerExpiredPinDuringBuildAllowsSuccessorGCAndRestart|TestLearnerExpiredPinAtManifestAllowsSuccessorGCAndRestart)$'
          -count=1 -timeout=8m
      - name: Learner checkpoint adoption crash and lease boundaries (race)
        env:
          CGO_ENABLED: 1
        run: >-
          go test -race -tags rhiza_local_testhooks .
          -run '^(TestLearnerHardKillAtAdoptionWALBoundaries|TestLearnerExpiredPinDuringBuildAllowsSuccessorGCAndRestart|TestLearnerExpiredPinAtManifestAllowsSuccessorGCAndRestart)$'
          -count=1 -timeout=8m
      - name: Node foreground certified GC preparation and attribution
        env:
          CGO_ENABLED: 1
        run: >-
          go test -tags rhiza_local_testhooks ./pkg/node ./pkg/checkpoint ./pkg/network
          -run '^(TestNodeForegroundCertifiedGCPreparationRequiresRealSealAndCurrent|TestNodeForegroundPreparationUsesFreshCanceledContexts|TestNodeForegroundPreparationDeadlineBridge|TestNodeArchiveExtentAttributionRowGate|TestNodeForegroundPublisherBusyCollectorBoundsConcurrentEvents|TestNodeForegroundArchiveBusy.*|TestNodeForegroundRecoveryPin.*|TestNodeForegroundOverloadSiteCollectorCountsFixedNames|TestCheckpointClaimLifecycle.*|TestNodeForegroundClaimLifecycle.*|TestNodeForegroundCheckpointClaimRetry.*|TestNodeForegroundBatchAdmissionCollectorAggregatesConcurrentEvents|TestInternalBatchAdmissionTaggedObserverAndDirectControlIsolation)$'
          -count=1 -timeout=1m
      - name: Node foreground certified GC preparation and attribution (race)
        env:
          CGO_ENABLED: 1
        run: >-
          go test -race -tags rhiza_local_testhooks ./pkg/node ./pkg/checkpoint
          -run '^(TestNodeForegroundCertifiedGCPreparationRequiresRealSealAndCurrent|TestNodeForegroundPreparationUsesFreshCanceledContexts|TestNodeForegroundPreparationDeadlineBridge|TestNodeArchiveExtentAttributionRowGate|TestNodeForegroundPublisherBusyCollectorBoundsConcurrentEvents|TestNodeForegroundArchiveBusy.*|TestNodeForegroundRecoveryPin.*|TestNodeForegroundOverloadSiteCollectorCountsFixedNames|TestCheckpointClaimLifecycle.*|TestNodeForegroundClaimLifecycle.*|TestNodeForegroundCheckpointClaimRetry.*)$'
          -count=1 -timeout=1m
      - name: Terminal decision handshake cancellation
        env:
          CGO_ENABLED: 1
        run: |
          go test -tags rhiza_local_testhooks ./pkg/network -run '^(TestTerminalDecisionCancelsUnneededPeerHandshake|TestServerGraphBatcherConstructedExactlyOnce|TestServerGraphBatcherPolicyAndClose)$' -count=1 -timeout=30s
          go test -tags rhiza_local_testhooks ./pkg/network -run '^TestPostSubmitKVSecondLookupFailureIsUnknown$' -count=1 -timeout=30s
          go test -tags rhiza_local_testhooks ./cmd/rhiza-ffi -run '^(TestManagedGraphStartupObserverPreservesFailureBoundary|TestManagedMutationDiagnosticPreservesWireAndRedacts|TestManagedStartupDiagnosticPreservesCodeAndRedactsCause|TestManagedReadyDiagnosticPreservesBoolABIAndRedactsCause)$' -count=1 -timeout=30s
          go test -tags rhiza_local_testhooks ./pkg/managedsql -run '^(TestManagedSQLCertifiedRecoveryGapHoldsPushAndPeriodicPull|TestManagedSQLRetainedOriginalAppliesCertifiedSuffixBeforeFinalize)$' -count=1 -timeout=60s
          go test -tags rhiza_local_testhooks ./pkg/managedsql -run '^(TestManagedGraphLongPollCloseCancelsBorrow|TestManagedGraphActualUnknownRetainsNativeOriginal|TestManagedGraphInitialRootBlocksApplicationAndHonorsCancellation|TestManagedGraphInitialRootCloseCancelsBackgroundWait)$' -count=1 -timeout=60s
          go test -tags rhiza_local_testhooks ./pkg/managedsql -run '^(TestManagedGraphPendingLearnedSlotMatchesExactTarget|TestManagedGraphPublic(RecoveryHealsPendingWithoutProposal|LinearizableReadHealsPendingWithoutProposal|NewWriteHealsPendingWithoutResubmission|RestartHealsCertifiedNativePending))$' -count=1 -timeout=60s
          go test -tags rhiza_local_testhooks ./pkg/managedsql -run '^TestManagedGraphPublic(PublisherCreatesCertifiedPairAndSuffix|RestartInstallsCertifiedPairAndSuffix)$' -count=1 -timeout=60s
          go test -tags rhiza_local_testhooks ./pkg/managedsql -run '^TestManagedGraphPublicNodeRecoversRetainedInstallAndLaterSuffix$' -count=1 -timeout=60s -v
          go test -tags rhiza_local_testhooks ./pkg/node -run '^TestManagedGraphStartupInstallPreparedLearner' -count=1 -timeout=60s -v
          go test -tags rhiza_local_testhooks ./pkg/node -run '^TestManagedAppendOnly(OpenFailureDoesNotPublishDuringAbortCleanup|NormalShutdownArchivesExistingCertifiedSuffix)$' -count=1 -timeout=60s -v
          go test -tags rhiza_local_testhooks ./pkg/node ./pkg/quepaxa -run '^(TestManagedGraphHigherFenceWithOlderRecordedSealMakesCertifiedProgress|TestCertifiedCheckpointRedeliveryPreservesFailedSync|TestCertifiedCheckpointRedeliveryPreservesCanceledSync|TestManagedGraphStalePromotionAuthenticatesNewerLocator|TestManagedGraphReconcileRefusesUncertifiedNativeStateBeforeOpen)$' -count=1 -timeout=60s
          go test -tags rhiza_local_testhooks ./pkg/network -run '^TestOverload(MutationAdmissionEmitsFixedSite|QueueReservationEmitsFixedSite|InputChannelFullEmitsFixedSite|WorkerInflightBytesEmitsFixedSite|ProposalAdmissionSubtypeEmitsFixedSite)$' -count=1 -timeout=30s
          go test -tags rhiza_local_testhooks ./pkg/node -run '^TestAdvanceCheckpointReadBarriersRetriesRealPreAdmissionRefusal$' -count=1 -timeout=30s
          go test -tags rhiza_local_testhooks ./pkg/recovery -run '^(TestArchiveCleanupReusesUnchangedPrefixAfterRealHeadConflict|TestArchiveCleanupReuseRequiresExactBaseAndRefPrefix|TestArchiveCleanupIncrementalPackingMatchesFullAtBoundaries|TestArchiveCleanupAmbiguousPublicationReloadsCommittedHead|TestArchiveCleanupCanceledAfterHeadConflictDoesNotRepublish)$' -count=1 -timeout=2m
      - name: Terminal decision handshake cancellation (race)
        env:
          CGO_ENABLED: 1
        run: |
          go test -race -tags rhiza_local_testhooks ./pkg/network -run '^(TestTerminalDecisionCancelsUnneededPeerHandshake|TestServerGraphBatcherConstructedExactlyOnce|TestServerGraphBatcherPolicyAndClose)$' -count=1 -timeout=30s
          go test -race -tags rhiza_local_testhooks ./pkg/network -run '^TestPostSubmitKVSecondLookupFailureIsUnknown$' -count=1 -timeout=30s
          go test -race -tags rhiza_local_testhooks ./cmd/rhiza-ffi -run '^(TestManagedGraphStartupObserverPreservesFailureBoundary|TestManagedMutationDiagnosticPreservesWireAndRedacts|TestManagedStartupDiagnosticPreservesCodeAndRedactsCause|TestManagedReadyDiagnosticPreservesBoolABIAndRedactsCause)$' -count=1 -timeout=30s
          go test -race -tags rhiza_local_testhooks ./pkg/managedsql -run '^(TestManagedSQLCertifiedRecoveryGapHoldsPushAndPeriodicPull|TestManagedSQLRetainedOriginalAppliesCertifiedSuffixBeforeFinalize)$' -count=1 -timeout=60s
          go test -race -tags rhiza_local_testhooks ./pkg/managedsql -run '^(TestManagedGraphLongPollCloseCancelsBorrow|TestManagedGraphActualUnknownRetainsNativeOriginal|TestManagedGraphInitialRootBlocksApplicationAndHonorsCancellation|TestManagedGraphInitialRootCloseCancelsBackgroundWait)$' -count=1 -timeout=60s
          go test -race -tags rhiza_local_testhooks ./pkg/managedsql -run '^(TestManagedGraphPendingLearnedSlotMatchesExactTarget|TestManagedGraphPublic(RecoveryHealsPendingWithoutProposal|LinearizableReadHealsPendingWithoutProposal|NewWriteHealsPendingWithoutResubmission|RestartHealsCertifiedNativePending))$' -count=1 -timeout=60s
          go test -race -tags rhiza_local_testhooks ./pkg/managedsql -run '^TestManagedGraphPublic(PublisherCreatesCertifiedPairAndSuffix|RestartInstallsCertifiedPairAndSuffix)$' -count=1 -timeout=60s
          go test -race -tags rhiza_local_testhooks ./pkg/managedsql -run '^TestManagedGraphPublicNodeRecoversRetainedInstallAndLaterSuffix$' -count=1 -timeout=60s -v
          go test -race -tags rhiza_local_testhooks ./pkg/node -run '^TestManagedGraphStartupInstallPreparedLearner' -count=1 -timeout=60s -v
          go test -race -tags rhiza_local_testhooks ./pkg/node -run '^TestManagedAppendOnly(OpenFailureDoesNotPublishDuringAbortCleanup|NormalShutdownArchivesExistingCertifiedSuffix)$' -count=1 -timeout=60s -v
          go test -race -tags rhiza_local_testhooks ./pkg/node ./pkg/quepaxa -run '^(TestManagedGraphHigherFenceWithOlderRecordedSealMakesCertifiedProgress|TestCertifiedCheckpointRedeliveryPreservesFailedSync|TestCertifiedCheckpointRedeliveryPreservesCanceledSync|TestManagedGraphStalePromotionAuthenticatesNewerLocator|TestManagedGraphReconcileRefusesUncertifiedNativeStateBeforeOpen)$' -count=1 -timeout=60s
          go test -race -tags rhiza_local_testhooks ./pkg/network -run '^TestOverload(MutationAdmissionEmitsFixedSite|QueueReservationEmitsFixedSite|InputChannelFullEmitsFixedSite|WorkerInflightBytesEmitsFixedSite|ProposalAdmissionSubtypeEmitsFixedSite)$' -count=1 -timeout=30s
          go test -race -tags rhiza_local_testhooks ./pkg/node -run '^TestAdvanceCheckpointReadBarriersRetriesRealPreAdmissionRefusal$' -count=1 -timeout=30s
          go test -race -tags rhiza_local_testhooks ./pkg/recovery -run '^(TestArchiveCleanupReusesUnchangedPrefixAfterRealHeadConflict|TestArchiveCleanupReuseRequiresExactBaseAndRefPrefix|TestArchiveCleanupIncrementalPackingMatchesFullAtBoundaries|TestArchiveCleanupAmbiguousPublicationReloadsCommittedHead|TestArchiveCleanupCanceledAfterHeadConflictDoesNotRepublish)$' -count=1 -timeout=2m
      - name: Managed Graph certified-progress admission and marker regressions
        env:
          CGO_ENABLED: 1
        run: >-
          go test -tags rhiza_local_testhooks ./pkg/node ./pkg/managedsql ./pkg/quepaxa ./cmd/rhiza-ffi
          -run '^(TestManagedGraphAdmission.*|TestManagedGraphInitialAdmission.*|TestManagedGraphStartupReconstruction.*|TestManagedGraphHostOperationContextSharesNodeObservationBudget|TestManagedControlObservationBudget.*|TestObserveManagedControl.*|TestUnpromotedLearnerWithoutRosterWALCannotQualifyAsVoter|TestManagedNoPVC.*|TestManagedStateWithoutContextRejectsUnstableProgressOnce|TestManagedGraphCloseCancelsActiveBackgroundAdmissionResampling|TestRuntimeProgressSnapshotIncludesActualPendingRecorder|TestPreparedCheckpointMarkersReopenAcrossCertifiedMembershipChanges|TestManagedGraphRustOffsetMaxOnPublicHost|TestManagedGraphAppliedPrefixFailureUsesOrdinaryFFIDiagnosticShape)$'
          -count=1 -timeout=60s
      - name: Managed Graph certified-progress admission and marker regressions (race)
        env:
          CGO_ENABLED: 1
        run: >-
          go test -race -tags rhiza_local_testhooks ./pkg/node ./pkg/managedsql ./pkg/quepaxa ./cmd/rhiza-ffi
          -run '^(TestManagedGraphAdmission.*|TestManagedGraphInitialAdmission.*|TestManagedGraphStartupReconstruction.*|TestManagedGraphHostOperationContextSharesNodeObservationBudget|TestManagedControlObservationBudget.*|TestObserveManagedControl.*|TestUnpromotedLearnerWithoutRosterWALCannotQualifyAsVoter|TestManagedNoPVC.*|TestManagedStateWithoutContextRejectsUnstableProgressOnce|TestManagedGraphCloseCancelsActiveBackgroundAdmissionResampling|TestRuntimeProgressSnapshotIncludesActualPendingRecorder|TestPreparedCheckpointMarkersReopenAcrossCertifiedMembershipChanges|TestManagedGraphRustOffsetMaxOnPublicHost|TestManagedGraphAppliedPrefixFailureUsesOrdinaryFFIDiagnosticShape)$'
          -count=1 -timeout=60s
      - name: Vet
        env:
          CGO_ENABLED: 0
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build ./cmd/rhiza ./cmd/rhiza-operator

      - name: Real server E2E
        env:
          CGO_ENABLED: 0
          RHIZA_BIND_ADDR: 127.0.0.1:18086
          RHIZA_PEER_ADDR: 127.0.0.1:19086
          RHIZA_DATA_DIR: ${{ runner.temp }}/rhiza-e2e
          RHIZA_E2E_URL: http://127.0.0.1:18086
        run: |
          go build -o "$RUNNER_TEMP/rhiza" ./cmd/rhiza
          "$RUNNER_TEMP/rhiza" >"$RUNNER_TEMP/rhiza-e2e.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            if curl --fail --silent "$RHIZA_E2E_URL/ready" >/dev/null; then
              go test -count=1 ./e2e -run '^TestSQLServer$'
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/rhiza-e2e.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$RUNNER_TEMP/rhiza-e2e.log"
          exit 1

      - name: Race detector
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Prepare container test tools
        run: |
          awk '
            { print }
            $0 == "FROM mirror.gcr.io/library/golang:1.27.3-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c AS builder" {
              print "RUN apk --no-cache add jq coreutils"
              matched++
            }
            END { if (matched != 1) exit 1 }
          ' Dockerfile > "$RUNNER_TEMP/Dockerfile.ci"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile.ci
          push: false
          tags: rhiza:ci

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.operator
          push: false
          tags: rhiza-operator:ci
