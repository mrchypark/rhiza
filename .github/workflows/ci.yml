name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arenas: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        env:
          GOEXPERIMENT: ${{ matrix.arenas && 'arenas' || '' }}
        run: go test ./...
      - name: Vet
        if: matrix.arenas == false
        run: go vet ./...
      - name: Build
        env:
          GOEXPERIMENT: ${{ matrix.arenas && 'arenas' || '' }}
        run: go build ./cmd/rhiza

      - name: Graph profile
        if: matrix.arenas == false
        run: go test -tags graph ./...

      - name: Race detector
        if: matrix.arenas == false
        run: go test -race ./...

      - name: Vulnerability scan
        if: matrix.arenas == false
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rhiza-sql-kv:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.graph
          push: false
          tags: rhiza-graph-kv:ci
