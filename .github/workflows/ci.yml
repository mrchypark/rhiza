name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arenas: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        env:
          CGO_ENABLED: 0
          GOEXPERIMENT: ${{ matrix.arenas && 'arenas' || '' }}
        run: go test ./...
      - name: Vet
        if: matrix.arenas == false
        env:
          CGO_ENABLED: 0
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: 0
          GOEXPERIMENT: ${{ matrix.arenas && 'arenas' || '' }}
        run: go build ./cmd/rhiza

      - name: Real server E2E
        if: matrix.arenas == false
        env:
          CGO_ENABLED: 0
          RHIZA_BIND_ADDR: 127.0.0.1:18086
          RHIZA_PEER_ADDR: 127.0.0.1:19086
          RHIZA_DATA_DIR: ${{ runner.temp }}/rhiza-e2e
          RHIZA_E2E_URL: http://127.0.0.1:18086
        run: |
          go build -o "$RUNNER_TEMP/rhiza" ./cmd/rhiza
          "$RUNNER_TEMP/rhiza" >"$RUNNER_TEMP/rhiza-e2e.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            if curl --fail --silent "$RHIZA_E2E_URL/ready" >/dev/null; then
              go test -count=1 ./e2e -run '^TestSQLServer$'
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/rhiza-e2e.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$RUNNER_TEMP/rhiza-e2e.log"
          exit 1

      - name: Production runtime experiments
        if: matrix.arenas == false
        env:
          CGO_ENABLED: 0
          GOEXPERIMENT: arenas,greenteagc
        run: go test ./...

      - name: Race detector
        if: matrix.arenas == false
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Vulnerability scan
        if: matrix.arenas == false
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rhiza:ci
