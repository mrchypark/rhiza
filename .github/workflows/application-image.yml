name: Application image

# Publishes a digest-pinned release application image from the repository
# Dockerfile, which contains both /usr/local/bin/rhiza and
# /usr/local/bin/rhiza-fencer. Only an immutable tag is pushed: sha-<commit>.
# Dispatch this workflow against the exact release commit.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA to build (defaults to the dispatched ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'mrchypark/rhiza'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve the immutable source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rhiza:sha-${{ steps.source.outputs.sha }}
          provenance: true
          sbom: true
      - name: Record the immutable digest
        run: |
          {
            # shellcheck disable=SC2016 # Markdown backticks are literal output.
            printf 'Application image: `ghcr.io/%s/rhiza:sha-%s`\n\n' "$GITHUB_REPOSITORY_OWNER" "${{ steps.source.outputs.sha }}"
            # shellcheck disable=SC2016 # Markdown backticks are literal output.
            printf 'Digest: `%s`\n' "${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

