name: Application image

# Publishes a digest-pinned release application image from the repository
# Dockerfile, which installs /usr/local/bin/rhiza and /usr/local/bin/rhiza-fencer.
# This is the supervised workload for the voterCount GCS/Chaos harness; it is not
# the e2e/chaos qualification host, which serves the older rhiza-entrypoint flow.
# Only the immutable tag sha-<commit> is pushed, and an existing tag is never
# retargeted. Dispatch this workflow against the exact release commit.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA to build (defaults to the dispatched ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'mrchypark/rhiza'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve the immutable commit and tag
        id: source
        run: |
          {
            sha=$(git rev-parse HEAD)
            echo "sha=$sha"
            echo "tag=sha-$sha"
            echo "image=ghcr.io/$GITHUB_REPOSITORY_OWNER/rhiza-application:sha-$sha"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to retarget an existing immutable tag
        run: |
          if docker manifest inspect "${{ steps.source.outputs.image }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.source.outputs.image }} already exists; immutable tags are never retargeted" >&2
            exit 1
          fi
      - name: Prepare container build tools
        run: |
          # The Dockerfile runs the qualification tests, which need jq and
          # coreutils; the minimal golang:alpine builder lacks them. Mirror the
          # ci.yml containers job so this build matches CI.
          awk '
            { print }
            $0 == "FROM mirror.gcr.io/library/golang:1.27.3-alpine@sha256:f2c872bcee949b7be9c490efd02b48a8a2fbf947cdf533f1c58525ec9d8170fd AS builder" {
              print "RUN apk --no-cache add jq coreutils"
              matched++
            }
            END { if (matched != 1) exit 1 }
          ' Dockerfile > "$RUNNER_TEMP/Dockerfile.ci"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.source.outputs.image }}
          provenance: true
          sbom: true
      - name: Verify anonymous pull access for the harness cluster
        run: |
          # The GCS/Chaos harness sets no imagePullSecrets, so the package must be
          # publicly pullable. GHCR may create a fresh package private, and the
          # immutable tag guard blocks a rerun, so record the real state instead
          # of failing: the digest is still published either way.
          owner="${{ github.repository_owner }}"
          token=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:$owner/rhiza-application:pull" | jq -r .token)
          # Without an Accept header GHCR answers 404 even for public images.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/$owner/rhiza-application/manifests/${{ steps.source.outputs.tag }}")
          if [ "$code" = "200" ]; then
            echo 'anonymous_pull=public' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::ghcr.io/$owner/rhiza-application is not anonymously pullable (HTTP $code); set the package visibility to public before the harness pulls it" >&2
            echo "anonymous_pull=private (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record the immutable digest
        run: |
          {
            # shellcheck disable=SC2016 # Markdown backticks are literal output.
            printf 'Application image: `%s`\n\n' "${{ steps.source.outputs.image }}"
            # shellcheck disable=SC2016 # Markdown backticks are literal output.
            printf 'Digest: `%s`\n' "${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
