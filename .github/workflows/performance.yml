name: Performance

on:
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - benchmarks/**
      - .github/workflows/performance.yml
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - benchmarks/**
      - .github/workflows/performance.yml
  workflow_dispatch:
    inputs:
      refresh_hiqlite_reference:
        description: Measure the pinned Hiqlite reference on the CI runner
        type: boolean
        default: false
      base_ref:
        description: Git ref to compare against
        required: true
        default: main
      candidate_ref:
        description: Candidate Git ref (defaults to this workflow ref)
        required: false
        default: ""

      network_optimization:
        description: Focused network optimization (none runs the full suite)
        type: choice
        options: [none, transport, auth, catchup]
        default: none

      issue185_cost_evidence:
        description: Run serialized local S3 checkpoint, archive-GC, Node.Open restore, and foreground cost evidence
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-go-benchmarks:
    if: ${{ !inputs.refresh_hiqlite_reference && !inputs.issue185_cost_evidence }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CGO_ENABLED: 0
      RHIZA_BENCH_COUNT: 10
      RHIZA_BENCH_TIME: 1s
      RHIZA_BENCH_PROCS: 2
      RHIZA_BENCH_NETWORK_OPTIMIZATION: ${{ inputs.network_optimization || 'none' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve comparison revisions
        id: revisions
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          candidate_sha=${PR_HEAD_SHA:-$(git rev-parse HEAD)}
          if [[ -n "$INPUT_CANDIDATE_REF" ]]; then
            if candidate_sha=$(git rev-parse --verify "$INPUT_CANDIDATE_REF^{commit}" 2>/dev/null); then
              :
            else
              git fetch --no-tags origin "$INPUT_CANDIDATE_REF"
              candidate_sha=$(git rev-parse FETCH_HEAD)
            fi
          elif ! git cat-file -e "$candidate_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags "$PR_HEAD_REPOSITORY" "$candidate_sha"
          fi
          if [[ -n "$PR_BASE_SHA" ]]; then
            if git cat-file -e "$PR_BASE_SHA:.github/workflows/performance.yml" 2>/dev/null; then
              base_sha=$PR_BASE_SHA
              baseline_mode=pull-request-base
            else
              base_sha=$(git rev-parse "$candidate_sha^")
              baseline_mode=bootstrap-previous-commit
            fi
          elif [[ -n "$PUSH_BASE_SHA" && "$PUSH_BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            base_sha=$PUSH_BASE_SHA
            baseline_mode=previous-main
          else
            if base_sha=$(git rev-parse --verify "$INPUT_BASE_REF^{commit}" 2>/dev/null); then
              :
            else
              git fetch --no-tags origin "$INPUT_BASE_REF"
              base_sha=$(git rev-parse FETCH_HEAD)
            fi
            baseline_mode=workflow-dispatch
          fi
          git cat-file -e "$base_sha^{commit}"
          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'candidate_sha=%s\n' "$candidate_sha"
            printf 'baseline_mode=%s\n' "$baseline_mode"
          } >>"$GITHUB_OUTPUT"

      - name: Install pinned benchstat
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260825160852-19be9d8e6c70
          printf '%s\n' "$GOBIN" >>"$GITHUB_PATH"

      - name: Run interleaved base and candidate benchmarks
        run: |
          benchmarks/run-ci-benchmarks.sh \
            "${{ steps.revisions.outputs.base_sha }}" \
            "${{ steps.revisions.outputs.candidate_sha }}" \
            "$RUNNER_TEMP/rhiza-performance"

      - name: Compare results
        run: |
          benchstat \
            "base=$RUNNER_TEMP/rhiza-performance/base.txt" \
            "candidate=$RUNNER_TEMP/rhiza-performance/candidate.txt" \
            | tee "$RUNNER_TEMP/rhiza-performance/benchstat.txt"
          # shellcheck disable=SC2016
          {
            printf '## Paired performance benchmarks\n\n'
            printf 'Fixed `ubuntu-24.04`, `GOMAXPROCS=2`; 10 interleaved samples per revision.\n\n'
            printf 'Baseline mode: `%s`.\n\n' '${{ steps.revisions.outputs.baseline_mode }}'
            printf '```text\n'
            cat "$RUNNER_TEMP/rhiza-performance/benchstat.txt"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Reuse pinned Hiqlite reference
        if: ${{ !inputs.network_optimization || inputs.network_optimization == 'none' }}
        env:
          HIQLITE_COMMIT: cc0c64c9e2369ad9bd8ee5aea8e6825e3d481249
        run: |
          reference=benchmarks/hiqlite-reference.json
          latest_version=$(git ls-remote --tags --refs https://github.com/sebadob/hiqlite.git 'refs/tags/v*' | awk -F/ '{print $3}' | sort -V | tail -1)
          [[ $latest_version == "$(jq -r '.version' "$reference")" ]]
          [[ $(git ls-remote --tags --refs https://github.com/sebadob/hiqlite.git refs/tags/v0.15.0 | cut -f1) == "$HIQLITE_COMMIT" ]]
          bash benchmarks/verify-hiqlite-reference.sh "$reference"
          cp "$reference" "$RUNNER_TEMP/rhiza-performance/hiqlite-reference.json"
          # shellcheck disable=SC2016
          {
            printf '\n## Pinned Hiqlite reference\n\n'
            printf 'Reused verified result for latest Hiqlite `%s`, unchanged commit `%s`, and benchmark patch.\n\n' "$latest_version" "$HIQLITE_COMMIT"
            printf 'Official `interval_200` three-node local-client workload: `%s ops/s`.\n\n' "$(jq -r '.ops_per_sec.interval_200_local' "$reference")"
            printf 'Power-loss-durable `immediate` workload: `%s ops/s`.\n\n' "$(jq -r '.ops_per_sec.immediate_local' "$reference")"
            printf 'Power-loss-durable remote-client workload: `%s ops/s`.\n\n' "$(jq -r '.ops_per_sec.immediate_remote' "$reference")"
            printf 'Raft follower gracefully stopped before measurement: `%s ops/s`.\n\n' "$(jq -r '.ops_per_sec.immediate_follower_stopped' "$reference")"
            printf 'Raft leader gracefully stopped before measurement: `%s ops/s`.\n\n' "$(jq -r '.ops_per_sec.immediate_leader_stopped' "$reference")"
            printf 'Source run: %s.\n' "$(jq -r '.source_run' "$reference")"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Run Rhiza real-server reference
        if: ${{ !inputs.network_optimization || inputs.network_optimization == 'none' }}
        env:
          RHIZA_SERVER_BENCH_REQUESTS: 100000
          RHIZA_SERVER_BENCH_CONCURRENCY: 16
        run: |
          git worktree add --detach "$RUNNER_TEMP/rhiza-server-candidate" "${{ steps.revisions.outputs.candidate_sha }}"
          git worktree add --detach "$RUNNER_TEMP/rhiza-server-base" "${{ steps.revisions.outputs.base_sha }}"
          benchmarks/run-server-reference.sh \
            "$RUNNER_TEMP/rhiza-server-candidate" \
            "$RUNNER_TEMP/rhiza-performance/rhiza-server.json"
          RHIZA_SERVER_BENCH_FAILED_NODE=n0 RHIZA_SERVER_BENCH_TARGET_NODE=n1 benchmarks/run-server-reference.sh \
            "$RUNNER_TEMP/rhiza-server-candidate" \
            "$RUNNER_TEMP/rhiza-performance/rhiza-server-n0-failed.json"
          RHIZA_SERVER_BENCH_FAILED_NODE=n1 RHIZA_SERVER_BENCH_TARGET_NODE=n2 benchmarks/run-server-reference.sh \
            "$RUNNER_TEMP/rhiza-server-candidate" \
            "$RUNNER_TEMP/rhiza-performance/rhiza-server-n1-failed.json"
          RHIZA_SERVER_BENCH_FAILED_NODE=n2 RHIZA_SERVER_BENCH_TARGET_NODE=n0 benchmarks/run-server-reference.sh \
            "$RUNNER_TEMP/rhiza-server-candidate" \
            "$RUNNER_TEMP/rhiza-performance/rhiza-server-n2-failed.json"
          for sample in 1 2 3; do
            if (( sample % 2 )); then
              RHIZA_SERVER_BENCH_DURABILITY=before-ack RHIZA_SERVER_BENCH_REQUESTS=10000 benchmarks/run-server-reference.sh \
                "$RUNNER_TEMP/rhiza-server-base" \
                "$RUNNER_TEMP/rhiza-performance/rhiza-server-before-ack-base-$sample.json"
              RHIZA_SERVER_BENCH_DURABILITY=before-ack RHIZA_SERVER_BENCH_REQUESTS=10000 benchmarks/run-server-reference.sh \
                "$RUNNER_TEMP/rhiza-server-candidate" \
                "$RUNNER_TEMP/rhiza-performance/rhiza-server-before-ack-candidate-$sample.json"
            else
              RHIZA_SERVER_BENCH_DURABILITY=before-ack RHIZA_SERVER_BENCH_REQUESTS=10000 benchmarks/run-server-reference.sh \
                "$RUNNER_TEMP/rhiza-server-candidate" \
                "$RUNNER_TEMP/rhiza-performance/rhiza-server-before-ack-candidate-$sample.json"
              RHIZA_SERVER_BENCH_DURABILITY=before-ack RHIZA_SERVER_BENCH_REQUESTS=10000 benchmarks/run-server-reference.sh \
                "$RUNNER_TEMP/rhiza-server-base" \
                "$RUNNER_TEMP/rhiza-performance/rhiza-server-before-ack-base-$sample.json"
            fi
          done
          rhiza_ops=$(jq -r '.result.success_ops_per_sec | floor' "$RUNNER_TEMP/rhiza-performance/rhiza-server.json")
          rhiza_p99=$(jq -r '.result.p99_ms' "$RUNNER_TEMP/rhiza-performance/rhiza-server.json")
          before_ack_base_ops=$(jq -sr '[.[].result.success_ops_per_sec] | sort | .[length / 2 | floor] | floor' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-base-*.json)
          before_ack_base_p99=$(jq -sr '[.[].result.p99_ms] | sort | .[length / 2 | floor]' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-base-*.json)
          before_ack_base_http=$(jq -sr '[.[].object_store_delta.http_requests] | sort | .[length / 2 | floor]' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-base-*.json)
          before_ack_candidate_ops=$(jq -sr '[.[].result.success_ops_per_sec] | sort | .[length / 2 | floor] | floor' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-candidate-*.json)
          before_ack_candidate_p99=$(jq -sr '[.[].result.p99_ms] | sort | .[length / 2 | floor]' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-candidate-*.json)
          before_ack_candidate_http=$(jq -sr '[.[].object_store_delta.http_requests] | sort | .[length / 2 | floor]' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-candidate-*.json)
          before_ack_candidate_put=$(jq -sr '[.[].object_store_delta.http_put_requests] | sort | .[length / 2 | floor]' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-candidate-*.json)
          # shellcheck disable=SC2016
          {
            printf '\n## Rhiza leaderless availability qualification\n\n'
            printf 'Async three-voter HTTP/QUIC workload (quorum-WAL ACK): `%s ops/s`, p99 `%s ms`.\n\n' "$rhiza_ops" "$rhiza_p99"
            for peer in n0 n1 n2; do
              file="$RUNNER_TEMP/rhiza-performance/rhiza-server-$peer-failed.json"
              ops=$(jq -r '.result.success_ops_per_sec | floor' "$file")
              p99=$(jq -r '.result.p99_ms' "$file")
              max=$(jq -r '.result.max_ms' "$file")
              retries=$(jq -r '.result.retries // 0' "$file")
              log_failures=$(jq -r '.runtime_failure_lines' "$file")
              printf 'Peer `%s` SIGKILL during load: `%s ops/s`, p99 `%s ms`, max `%s ms`, `%s` commit-unknown retries, zero failed writes, `%s` runtime failure log lines.\n\n' "$peer" "$ops" "$p99" "$max" "$retries" "$log_failures"
            done
            printf 'QuePaxa has no stable leader role, so failures are reported by peer identity. Each fault is injected during `-c 16 -n 100000`; every acknowledged row is verified by a linearizable query.\n'
            printf '\n## Rhiza before-ack durability qualification\n\n'
            printf 'Three interleaved healthy HTTP/QUIC samples (`-c 16 -n 10000`) wait for object-store durability before each acknowledgement. Median base: `%s ops/s`, p99 `%s ms`; candidate: `%s ops/s`, p99 `%s ms`.\n\n' "$before_ack_base_ops" "$before_ack_base_p99" "$before_ack_candidate_ops" "$before_ack_candidate_p99"
            printf 'Base object-store HTTP request delta: `%s`.\n\n' "$before_ack_base_http"
            printf 'Candidate object-store delta from post-schema setup through final linearizable verification: `%s` HTTP requests, `%s` PUT requests. Full logical and HTTP method counters are retained in the JSON artifacts.\n' "$before_ack_candidate_http" "$before_ack_candidate_put"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Record runner environment
        if: ${{ !inputs.network_optimization || inputs.network_optimization == 'none' }}
        run: |
          {
            printf '\nbaseline_mode=%s\n' '${{ steps.revisions.outputs.baseline_mode }}'
            printf '\nrunner_image=%s\n' "$ImageOS-$ImageVersion"
            printf 'hiqlite_commit=%s\n' cc0c64c9e2369ad9bd8ee5aea8e6825e3d481249
            printf 'hiqlite_result=reused-verified-reference\n'
            printf 'hiqlite_official_log_sync=interval_200\n'
            printf 'hiqlite_durable_log_sync=immediate\n'
            printf 'rhiza_failure_scenarios=each_peer_sigkill_during_timed_workload\n'
            printf 'rhiza_before_ack_scenarios=three_interleaved_healthy_base_and_candidate_http_quic_samples\n'
            printf 'hiqlite_failure_scenarios=raft_leader_or_follower_gracefully_stopped_before_timed_workload\n'
            lscpu
            free -b
          } >>"$RUNNER_TEMP/rhiza-performance/environment.txt"

      - name: Record focused network environment
        if: ${{ inputs.network_optimization && inputs.network_optimization != 'none' }}
        run: |
          {
            printf '\nrunner_image=%s\n' "$ImageOS-$ImageVersion"
            lscpu
            free -b
          } >>"$RUNNER_TEMP/rhiza-performance/environment.txt"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/rhiza-performance
          if-no-files-found: error
          retention-days: 30

  issue185-cost-evidence:
    if: ${{ inputs.issue185_cost_evidence }}
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Initialize evidence directory
        run: mkdir -p "$RUNNER_TEMP/issue-185-cost-evidence/logs" "$RUNNER_TEMP/issue-185-cost-evidence/versity-raw"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify pinned local Versity Gateway
        env:
          VERSITY_ARCHIVE_SHA256: 4953096f65a9c0d62ab184fb6b2ba7c2435229205cf00a56cb62cd4bf6b216ca
        run: |
          evidence_dir="$RUNNER_TEMP/issue-185-cost-evidence"
          mkdir -p "$evidence_dir/versity"
          archive="$RUNNER_TEMP/versitygw_v1.8.0_Darwin_arm64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/versity/versitygw/releases/download/v1.8.0/versitygw_v1.8.0_Darwin_arm64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$VERSITY_ARCHIVE_SHA256" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$evidence_dir/versity"
          binary="$evidence_dir/versity/versitygw_v1.8.0_Darwin_arm64/versitygw"
          test -x "$binary"
          test "$(uname -m)" = arm64
          binary_version=$("$binary" --version)
          printf '%s\n' "$binary_version" | grep -F 'Version  : 1.8.0'
          binary_sha256=$(shasum -a 256 "$binary" | awk '{print $1}')
          printf 'RHIZA_VERSITYGW_BIN=%s\n' "$binary" >>"$GITHUB_ENV"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner_label=macos-15\n'
            printf 'macos_version=%s\n' "$(sw_vers -productVersion)"
            printf 'architecture=%s\n' "$(uname -m)"
            printf 'go=%s\n' "$(go version)"
            printf 'versity_archive_sha256=%s\n' "$VERSITY_ARCHIVE_SHA256"
            printf 'versity_binary_sha256=%s\n' "$binary_sha256"
            printf 'versity_version=%s\n' "$binary_version"
          } >"$evidence_dir/environment.txt"

      - name: Run local provider and foreground evidence serially
        env:
          CGO_ENABLED: "1"
          RHIZA_VERSITY_EVIDENCE_DIR: ${{ runner.temp }}/issue-185-cost-evidence/versity-raw
        run: |
          evidence_dir="$RUNNER_TEMP/issue-185-cost-evidence"
          mkdir -p "$evidence_dir/logs"
          : >"$evidence_dir/commands.txt"
          : >"$evidence_dir/exits.tsv"
          : >"$evidence_dir/cleanup.tsv"
          gateway_run_dirs() {
            base=$RHIZA_VERSITY_EVIDENCE_DIR
            [ -d "$base" ] || return 0
            for run_dir in "$base"/versity-*; do
              [ -d "$run_dir" ] && printf '%s\n' "$run_dir"
            done
            return 0
          }
          wait_for_gateway_completion() {
            previous_runs=$1
            while IFS= read -r run_dir; do
              [ -d "$run_dir" ] || continue
              if printf '%s\n' "$previous_runs" | grep -Fqx "$run_dir"; then
                continue
              fi
              marker="$run_dir/gateway-complete"
              attempt=0
              while [ ! -f "$marker" ] && [ "$attempt" -lt 100 ]; do
                sleep 0.1
                attempt=$((attempt + 1))
              done
              if [ ! -f "$marker" ]; then
                printf '%s\tmissing-after-10s\n' "$run_dir" | tee -a "$evidence_dir/cleanup.tsv"
                return 1
              fi
              if ! grep -Fqx 'gateway_reaped=true' "$marker"; then
                printf '%s\tinvalid-completion-marker\n' "$run_dir" | tee -a "$evidence_dir/cleanup.tsv"
                return 1
              fi
              printf '%s\tcomplete\t' "$run_dir" | tee -a "$evidence_dir/cleanup.tsv"
              tr '\n' ' ' <"$marker" | tee -a "$evidence_dir/cleanup.tsv"
              printf '\n' | tee -a "$evidence_dir/cleanup.tsv"
            done < <(gateway_run_dirs)
          }
          run_logged() {
            label=$1
            shift
            {
              printf '%s\t' "$label"
              printf '%q ' "$@"
              printf '\n'
            } | tee -a "$evidence_dir/commands.txt"
            previous_runs=$(gateway_run_dirs)
            if "$@" >"$evidence_dir/logs/$label.log" 2>&1; then
              status=0
            else
              status=$?
            fi
            if wait_for_gateway_completion "$previous_runs"; then
              cleanup_status=0
            else
              cleanup_status=$?
            fi
            printf '%s\t%s\n' "$label" "$status" | tee -a "$evidence_dir/exits.tsv"
            cat "$evidence_dir/logs/$label.log"
            if [[ $status -ne 0 ]]; then
              return "$status"
            fi
            if [[ $cleanup_status -ne 0 ]]; then
              return "$cleanup_status"
            fi
          }

          run_logged versity-smoke env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=2m ./internal/objstore \
            -run '^TestVersityGatewayCostEvidence$'
          run_logged versity-sdk-retry env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=2m ./internal/objstore \
            -run '^TestVersitySDKRetryEvidence$'
          run_logged versity-conditional-large-put env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=2m ./internal/objstore \
            -run '^TestVersityConditionalLargePutEvidence$'
          run_logged archive-attribution-regression env \
            CGO_ENABLED=1 go test -count=1 -v -tags rhiza_local_testhooks -timeout=2m ./pkg/recovery \
            -run '^TestArchiveExtentAttributionActualGuard$'
          run_logged checkpoint-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=5m ./pkg/checkpoint \
            -run '^TestCheckpointCost$'
          run_logged archive-gc-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=5m ./pkg/recovery \
            -run '^TestArchiveGCCost$'
          run_logged node-open-restore-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=5m ./pkg/node \
            -run '^TestCheckpointRestoreCostExercisesNodeRecoveryPathS3$'
          run_logged node-learn-gap-lifecycle-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -tags rhiza_local_testhooks -timeout=3m ./pkg/node \
            -run '^TestNodeOpenCatchUpRepairsHeldLearnGapForConcurrentKVCalls$'
          run_logged node-learn-gap-lifecycle-race-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -race -tags rhiza_local_testhooks -timeout=3m ./pkg/node \
            -run '^TestNodeOpenCatchUpRepairsHeldLearnGapForConcurrentKVCalls$'
          run_logged node-foreground-cost-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            RHIZA_NODE_FOREGROUND_API_COST=1 \
            RHIZA_NODE_FOREGROUND_API_COST_SCENARIO=baseline \
            go test -count=1 -v -tags rhiza_local_testhooks -timeout=7m ./pkg/node \
            -run '^TestNodeForegroundAPICostS3$'
          run_logged node-foreground-checkpoint-active-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            RHIZA_NODE_FOREGROUND_API_COST=1 \
            RHIZA_NODE_FOREGROUND_API_COST_SCENARIO=checkpoint-active \
            go test -count=1 -v -tags rhiza_local_testhooks -timeout=7m ./pkg/node \
            -run '^TestNodeForegroundAPICostS3$'
          run_logged node-foreground-archive-cleanup-active-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            RHIZA_NODE_FOREGROUND_API_COST=1 \
            RHIZA_NODE_FOREGROUND_API_COST_SCENARIO=archive-cleanup-active \
            go test -count=1 -v -tags rhiza_local_testhooks -timeout=7m ./pkg/node \
            -run '^TestNodeForegroundAPICostS3$'

      - name: Upload issue 185 cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-185-cost-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-185-cost-evidence
          if-no-files-found: error
          retention-days: 30

  refresh-hiqlite-reference:
    if: ${{ inputs.refresh_hiqlite_reference }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HIQLITE_COMMIT: cc0c64c9e2369ad9bd8ee5aea8e6825e3d481249
    steps:
      - uses: actions/checkout@v4
      - name: Measure Hiqlite v0.15.0
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/hiqlite-target"
          rustup toolchain install 1.97.1 --profile minimal
          git clone --filter=blob:none https://github.com/sebadob/hiqlite.git "$RUNNER_TEMP/hiqlite"
          git -C "$RUNNER_TEMP/hiqlite" checkout --detach "$HIQLITE_COMMIT"
          git -C "$RUNNER_TEMP/hiqlite" apply --unidiff-zero --whitespace=nowarn "$GITHUB_WORKSPACE/benchmarks/hiqlite-one-peer.patch"
          cargo +1.97.1 build --release --manifest-path "$RUNNER_TEMP/hiqlite/examples/bench/Cargo.toml"
          mkdir -p "$RUNNER_TEMP/hiqlite-reference"
          cd "$RUNNER_TEMP/hiqlite/examples/bench"
          printf 'Measuring interval_200_local\n'
          HQL_LOG_SYNC=interval_200 timeout 10m "$CARGO_TARGET_DIR/release/bench" cluster --sql-only -c 16 -r 100000 >"$RUNNER_TEMP/hiqlite-reference/interval_200_local.txt" 2>&1
          printf 'Measuring immediate_local\n'
          HQL_LOG_SYNC=immediate timeout 10m "$CARGO_TARGET_DIR/release/bench" cluster --sql-only -c 16 -r 100000 >"$RUNNER_TEMP/hiqlite-reference/immediate_local.txt" 2>&1
          printf 'Measuring immediate_remote\n'
          HQL_LOG_SYNC=immediate timeout 10m "$CARGO_TARGET_DIR/release/bench" cluster --remote-client --sql-only -c 16 -r 100000 >"$RUNNER_TEMP/hiqlite-reference/immediate_remote.txt" 2>&1
          printf 'Measuring immediate_follower_stopped\n'
          HQL_LOG_SYNC=immediate timeout 10m "$CARGO_TARGET_DIR/release/bench" cluster --remote-client --sql-only --fail-peer non-leader -c 16 -r 100000 >"$RUNNER_TEMP/hiqlite-reference/immediate_follower_stopped.txt" 2>&1
          printf 'Measuring immediate_leader_stopped\n'
          HQL_LOG_SYNC=immediate timeout 10m "$CARGO_TARGET_DIR/release/bench" cluster --remote-client --sql-only --fail-peer leader -c 16 -r 100000 >"$RUNNER_TEMP/hiqlite-reference/immediate_leader_stopped.txt" 2>&1
          for scenario in interval_200_local immediate_local immediate_remote immediate_follower_stopped immediate_leader_stopped; do
            file="$RUNNER_TEMP/hiqlite-reference/$scenario.txt"
            ops=$(awk '/single INSERTs/{getline; print $4; exit}' "$file")
            [[ $ops =~ ^[0-9]+$ ]]
            printf '%s=%s\n' "$scenario" "$ops" >>"$RUNNER_TEMP/hiqlite-reference/ops.txt"
          done
          jq -n \
            --arg version v0.15.0 \
            --arg commit "$HIQLITE_COMMIT" \
            --arg patch "$(sha256sum "$GITHUB_WORKSPACE/benchmarks/hiqlite-one-peer.patch" | cut -d' ' -f1)" \
            --arg measured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --rawfile ops "$RUNNER_TEMP/hiqlite-reference/ops.txt" \
            '{version:$version,commit:$commit,patch_sha256:$patch,measured_at:$measured_at,source_run:$source_run,requests:100000,concurrency:16,ops_per_sec:($ops|split("\n")|map(select(length>0)|split("="))|map({(.[0]):(.[1]|tonumber)})|add)}' \
            >"$RUNNER_TEMP/hiqlite-reference/hiqlite-reference.json"
          cat "$RUNNER_TEMP/hiqlite-reference/hiqlite-reference.json"
          printf 'runner_image=%s\nrust=%s\n' "$ImageOS-$ImageVersion" "$(rustc +1.97.1 --version)" >"$RUNNER_TEMP/hiqlite-reference/environment.txt"
      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiqlite-reference-${{ github.run_id }}
          path: ${{ runner.temp }}/hiqlite-reference
          if-no-files-found: error
          retention-days: 30
