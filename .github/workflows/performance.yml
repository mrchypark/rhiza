name: Performance

on:
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - benchmarks/**
      - .github/workflows/performance.yml
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - benchmarks/**
      - .github/workflows/performance.yml
  workflow_dispatch:
    inputs:
      refresh_hiqlite_reference:
        description: Measure the pinned Hiqlite reference on the CI runner
        type: boolean
        default: false
      base_ref:
        description: Git ref to compare against
        required: true
        default: main
      candidate_ref:
        description: Candidate Git ref (defaults to this workflow ref)
        required: false
        default: ""

      network_optimization:
        description: Focused network optimization (none runs the full suite)
        type: choice
        options: [none, transport, auth, catchup]
        default: none

      issue185_cost_evidence:
        description: Run serialized local S3 checkpoint, archive-GC, Node.Open restore, and foreground cost evidence
        type: boolean
        default: false
      before_ack_sample_diagnostics:
        description: Run separate temporary BeforeAck slot-sampling calibration after the normal jobs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.before_ack_sample_diagnostics && 'performance-diagnostic-quarantine' || format('performance-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.before_ack_sample_diagnostics }}

jobs:
  archive-head-allocation-profile:
    if: ${{ !inputs.before_ack_sample_diagnostics && !inputs.refresh_hiqlite_reference && !inputs.issue185_cost_evidence && (inputs.network_optimization == '' || inputs.network_optimization == 'none') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Profile large authenticated archive head readback
        run: |
          mkdir -p "$RUNNER_TEMP/archive-head-profile"
          git rev-parse HEAD > "$RUNNER_TEMP/archive-head-profile/commit.txt"
          go version > "$RUNNER_TEMP/archive-head-profile/go-version.txt"
          go test ./pkg/recovery -run '^$' \
            -bench '^BenchmarkArchiveHeadEvidenceStages$/^large-authenticated-history$/^stable-readback$' \
            -benchtime=10x -count=1 -memprofilerate=1 \
            -memprofile "$RUNNER_TEMP/archive-head-profile/allocs.pprof" \
            -o "$RUNNER_TEMP/archive-head-profile/recovery.test" \
            | tee "$RUNNER_TEMP/archive-head-profile/benchmark.txt"
          grep -q '^BenchmarkArchiveHeadEvidenceStages/large-authenticated-history/stable-readback' \
            "$RUNNER_TEMP/archive-head-profile/benchmark.txt"
          printf '%s\n' 'The profile covers the whole test process, including benchmark fixture setup; benchmark.txt reports per-operation allocations.' > "$RUNNER_TEMP/archive-head-profile/README.txt"
          go tool pprof -top -alloc_space "$RUNNER_TEMP/archive-head-profile/recovery.test" \
            "$RUNNER_TEMP/archive-head-profile/allocs.pprof" > "$RUNNER_TEMP/archive-head-profile/alloc-space.txt"
          go tool pprof -top -alloc_objects "$RUNNER_TEMP/archive-head-profile/recovery.test" \
            "$RUNNER_TEMP/archive-head-profile/allocs.pprof" > "$RUNNER_TEMP/archive-head-profile/alloc-objects.txt"
      - name: Upload archive head allocation profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-head-allocation-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/archive-head-profile
          if-no-files-found: error
          retention-days: 30

  paired-go-benchmarks:
    if: ${{ !inputs.before_ack_sample_diagnostics && !inputs.refresh_hiqlite_reference && !inputs.issue185_cost_evidence }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CGO_ENABLED: 0
      RHIZA_BENCH_COUNT: 10
      RHIZA_BENCH_TIME: 1s
      RHIZA_BENCH_PROCS: 2
      RHIZA_BENCH_NETWORK_OPTIMIZATION: ${{ inputs.network_optimization || 'none' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve comparison revisions
        id: revisions
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          candidate_sha=${PR_HEAD_SHA:-$(git rev-parse HEAD)}
          if [[ -n "$INPUT_CANDIDATE_REF" ]]; then
            if candidate_sha=$(git rev-parse --verify "$INPUT_CANDIDATE_REF^{commit}" 2>/dev/null); then
              :
            else
              git fetch --no-tags origin "$INPUT_CANDIDATE_REF"
              candidate_sha=$(git rev-parse FETCH_HEAD)
            fi
          elif ! git cat-file -e "$candidate_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags "$PR_HEAD_REPOSITORY" "$candidate_sha"
          fi
          if [[ -n "$PR_BASE_SHA" ]]; then
            if git cat-file -e "$PR_BASE_SHA:.github/workflows/performance.yml" 2>/dev/null; then
              base_sha=$PR_BASE_SHA
              baseline_mode=pull-request-base
            else
              base_sha=$(git rev-parse "$candidate_sha^")
              baseline_mode=bootstrap-previous-commit
            fi
          elif [[ -n "$PUSH_BASE_SHA" && "$PUSH_BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            base_sha=$PUSH_BASE_SHA
            baseline_mode=previous-main
          else
            if base_sha=$(git rev-parse --verify "$INPUT_BASE_REF^{commit}" 2>/dev/null); then
              :
            else
              git fetch --no-tags origin "$INPUT_BASE_REF"
              base_sha=$(git rev-parse FETCH_HEAD)
            fi
            baseline_mode=workflow-dispatch
          fi
          git cat-file -e "$base_sha^{commit}"
          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'candidate_sha=%s\n' "$candidate_sha"
            printf 'baseline_mode=%s\n' "$baseline_mode"
          } >>"$GITHUB_OUTPUT"

      - name: Install pinned benchstat
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260825160852-19be9d8e6c70
          printf '%s\n' "$GOBIN" >>"$GITHUB_PATH"

      - name: Check benchmark harnesses without compilation
        run: |
          sh benchmarks/run-ci-benchmarks_test.sh
          bash benchmarks/run-server-reference_test.sh

      - name: Run interleaved base and candidate benchmarks
        run: |
          benchmarks/run-ci-benchmarks.sh \
            "${{ steps.revisions.outputs.base_sha }}" \
            "${{ steps.revisions.outputs.candidate_sha }}" \
            "$RUNNER_TEMP/rhiza-performance"

      - name: Compare results
        run: |
          benchstat \
            "base=$RUNNER_TEMP/rhiza-performance/base.txt" \
            "candidate=$RUNNER_TEMP/rhiza-performance/candidate.txt" \
            | tee "$RUNNER_TEMP/rhiza-performance/benchstat.txt"
          # shellcheck disable=SC2016
          {
            printf '## Paired performance benchmarks\n\n'
            printf 'Fixed `ubuntu-24.04`, `GOMAXPROCS=2`; 10 interleaved samples per revision.\n\n'
            printf 'Baseline mode: `%s`.\n\n' '${{ steps.revisions.outputs.baseline_mode }}'
            printf '```text\n'
            cat "$RUNNER_TEMP/rhiza-performance/benchstat.txt"
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Reuse pinned Hiqlite reference
        if: ${{ !inputs.network_optimization || inputs.network_optimization == 'none' }}
        env:
          HIQLITE_COMMIT: fd45e758af9ab2ff976813a6a511772d676562f1
        run: |
          reference=benchmarks/hiqlite-reference.json
          latest_version=$(git ls-remote --tags --refs https://github.com/sebadob/hiqlite.git 'refs/tags/v*' | awk -F/ '{print $3}' | sort -V | tail -1)
          [[ $latest_version == "$(jq -r '.version' "$reference")" ]]
          [[ $(git ls-remote --tags --refs https://github.com/sebadob/hiqlite.git refs/tags/v0.16.0 | cut -f1) == "$HIQLITE_COMMIT" ]]
          bash benchmarks/verify-hiqlite-reference.sh "$reference"
          cp "$reference" "$RUNNER_TEMP/rhiza-performance/hiqlite-reference.json"
          # shellcheck disable=SC2016
          {
            printf '\n## Pinned Hiqlite reference\n\n'
            printf 'Reused verified result for latest Hiqlite `%s`, unchanged commit `%s`, and benchmark patch.\n\n' "$latest_version" "$HIQLITE_COMMIT"
            printf 'Official `interval_200` three-node local-client workload: `%s ops/s`.\n\n' "$(jq -r '.ops_per_sec.interval_200_local' "$reference")"
            printf 'Power-loss-durable `immediate` workload: `%s ops/s`.\n\n' "$(jq -r '.ops_per_sec.immediate_local' "$reference")"
            printf 'Power-loss-durable remote-client workload: `%s ops/s`.\n\n' "$(jq -r '.ops_per_sec.immediate_remote' "$reference")"
            printf 'Raft follower gracefully stopped before measurement: `%s ops/s`.\n\n' "$(jq -r '.ops_per_sec.immediate_follower_stopped' "$reference")"
            printf 'Raft leader gracefully stopped before measurement: `%s ops/s`.\n\n' "$(jq -r '.ops_per_sec.immediate_leader_stopped' "$reference")"
            printf 'Source run: %s.\n' "$(jq -r '.source_run' "$reference")"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Run Rhiza real-server reference
        id: server_reference
        if: ${{ !inputs.network_optimization || inputs.network_optimization == 'none' }}
        env:
          RHIZA_SERVER_BENCH_REQUESTS: 100000
          RHIZA_SERVER_BENCH_CONCURRENCY: 16
        run: |
          git worktree add --detach "$RUNNER_TEMP/rhiza-server-candidate" "${{ steps.revisions.outputs.candidate_sha }}"
          git worktree add --detach "$RUNNER_TEMP/rhiza-server-base" "${{ steps.revisions.outputs.base_sha }}"
          printf 'healthy\n' > "$RUNNER_TEMP/rhiza-performance/fault-diagnostic-lane.txt"
          benchmarks/run-server-reference.sh \
            "$RUNNER_TEMP/rhiza-server-candidate" \
            "$RUNNER_TEMP/rhiza-performance/rhiza-server.json"
          printf 'n0 n1 async\n' > "$RUNNER_TEMP/rhiza-performance/fault-diagnostic-lane.txt"
          RHIZA_SERVER_BENCH_LIVE_PROGRESS=1 RHIZA_SERVER_BENCH_FAILED_NODE=n0 RHIZA_SERVER_BENCH_TARGET_NODE=n1 benchmarks/run-server-reference.sh \
            "$RUNNER_TEMP/rhiza-server-candidate" \
            "$RUNNER_TEMP/rhiza-performance/rhiza-server-n0-failed.json"
          printf 'n1 n2 async\n' > "$RUNNER_TEMP/rhiza-performance/fault-diagnostic-lane.txt"
          RHIZA_SERVER_BENCH_LIVE_PROGRESS=1 RHIZA_SERVER_BENCH_FAILED_NODE=n1 RHIZA_SERVER_BENCH_TARGET_NODE=n2 benchmarks/run-server-reference.sh \
            "$RUNNER_TEMP/rhiza-server-candidate" \
            "$RUNNER_TEMP/rhiza-performance/rhiza-server-n1-failed.json"
          printf 'n2 n0 async\n' > "$RUNNER_TEMP/rhiza-performance/fault-diagnostic-lane.txt"
          RHIZA_SERVER_BENCH_FAILED_NODE=n2 RHIZA_SERVER_BENCH_TARGET_NODE=n0 benchmarks/run-server-reference.sh \
            "$RUNNER_TEMP/rhiza-server-candidate" \
            "$RUNNER_TEMP/rhiza-performance/rhiza-server-n2-failed.json"
          printf 'before-ack-healthy\n' > "$RUNNER_TEMP/rhiza-performance/fault-diagnostic-lane.txt"
          for sample in 1 2 3; do
            if (( sample % 2 )); then
              RHIZA_SERVER_BENCH_DURABILITY=before-ack RHIZA_SERVER_BENCH_REQUESTS=10000 benchmarks/run-server-reference.sh \
                "$RUNNER_TEMP/rhiza-server-base" \
                "$RUNNER_TEMP/rhiza-performance/rhiza-server-before-ack-base-$sample.json"
              RHIZA_SERVER_BENCH_DURABILITY=before-ack RHIZA_SERVER_BENCH_REQUESTS=10000 benchmarks/run-server-reference.sh \
                "$RUNNER_TEMP/rhiza-server-candidate" \
                "$RUNNER_TEMP/rhiza-performance/rhiza-server-before-ack-candidate-$sample.json"
            else
              RHIZA_SERVER_BENCH_DURABILITY=before-ack RHIZA_SERVER_BENCH_REQUESTS=10000 benchmarks/run-server-reference.sh \
                "$RUNNER_TEMP/rhiza-server-candidate" \
                "$RUNNER_TEMP/rhiza-performance/rhiza-server-before-ack-candidate-$sample.json"
              RHIZA_SERVER_BENCH_DURABILITY=before-ack RHIZA_SERVER_BENCH_REQUESTS=10000 benchmarks/run-server-reference.sh \
                "$RUNNER_TEMP/rhiza-server-base" \
                "$RUNNER_TEMP/rhiza-performance/rhiza-server-before-ack-base-$sample.json"
            fi
          done
          rhiza_ops=$(jq -r '.result.success_ops_per_sec | floor' "$RUNNER_TEMP/rhiza-performance/rhiza-server.json")
          rhiza_p99=$(jq -r '.result.p99_ms' "$RUNNER_TEMP/rhiza-performance/rhiza-server.json")
          before_ack_base_ops=$(jq -sr '[.[].result.success_ops_per_sec] | sort | .[length / 2 | floor] | floor' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-base-*.json)
          before_ack_base_p99=$(jq -sr '[.[].result.p99_ms] | sort | .[length / 2 | floor]' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-base-*.json)
          before_ack_base_http=$(jq -sr '[.[].object_store_delta.http_requests] | sort | .[length / 2 | floor]' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-base-*.json)
          before_ack_candidate_ops=$(jq -sr '[.[].result.success_ops_per_sec] | sort | .[length / 2 | floor] | floor' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-candidate-*.json)
          before_ack_candidate_p99=$(jq -sr '[.[].result.p99_ms] | sort | .[length / 2 | floor]' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-candidate-*.json)
          before_ack_candidate_http=$(jq -sr '[.[].object_store_delta.http_requests] | sort | .[length / 2 | floor]' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-candidate-*.json)
          before_ack_candidate_put=$(jq -sr '[.[].object_store_delta.http_put_requests] | sort | .[length / 2 | floor]' "$RUNNER_TEMP"/rhiza-performance/rhiza-server-before-ack-candidate-*.json)
          # shellcheck disable=SC2016
          {
            printf '\n## Rhiza leaderless availability qualification\n\n'
            printf 'Async three-voter HTTP/QUIC workload (quorum-WAL ACK): `%s ops/s`, p99 `%s ms`.\n\n' "$rhiza_ops" "$rhiza_p99"
            for peer in n0 n1 n2; do
              file="$RUNNER_TEMP/rhiza-performance/rhiza-server-$peer-failed.json"
              ops=$(jq -r '.result.success_ops_per_sec | floor' "$file")
              p99=$(jq -r '.result.p99_ms' "$file")
              max=$(jq -r '.result.max_ms' "$file")
              retries=$(jq -r '.result.retries // 0' "$file")
              log_failures=$(jq -r '.runtime_failure_lines' "$file")
              printf 'Peer `%s` SIGKILL during load: `%s ops/s`, p99 `%s ms`, max `%s ms`, `%s` commit-unknown retries, zero failed writes, `%s` runtime failure log lines.\n\n' "$peer" "$ops" "$p99" "$max" "$retries" "$log_failures"
            done
            printf 'QuePaxa has no stable leader role, so failures are reported by peer identity. Fault lanes require the same sent, unfinished logical request across probes bracketing SIGKILL during `-c 16 -n 100000`; missing overlap does not qualify. The client validates INSERT receipts and a linearizable query checks the exact expected primary-key set. This does not prove the failed voter was processing the witness request.\n'
            printf 'Base and candidate servers use the same candidate client; its revision, binary SHA, receipt oracle and fault-only instrumentation are recorded in each result. Receipt parsing and trace/control overhead are part of this workload, so old uninstrumented results are not equivalent comparisons.\n'
            printf '\n## Rhiza before-ack durability qualification\n\n'
            printf 'Three interleaved healthy HTTP/QUIC samples (`-c 16 -n 10000`) wait for object-store durability before each acknowledgement. Median base: `%s ops/s`, p99 `%s ms`; candidate: `%s ops/s`, p99 `%s ms`.\n\n' "$before_ack_base_ops" "$before_ack_base_p99" "$before_ack_candidate_ops" "$before_ack_candidate_p99"
            printf 'Base object-store HTTP request delta: `%s`.\n\n' "$before_ack_base_http"
            printf 'Candidate object-store delta from post-schema setup through final linearizable verification: `%s` HTTP requests, `%s` PUT requests. Full logical and HTTP method counters are retained in the JSON artifacts.\n' "$before_ack_candidate_http" "$before_ack_candidate_put"
          } >>"$GITHUB_STEP_SUMMARY"

      # This separate tagged run never changes the uninstrumented gate result.
      - name: Capture tagged fault diagnostics after reference failure
        if: ${{ failure() && steps.server_reference.outcome == 'failure' }}
        timeout-minutes: 15
        env:
          RHIZA_SERVER_BENCH_LATENCY_DIAGNOSTICS: 1
          RHIZA_SERVER_BENCH_LIVE_PROGRESS: 1
          RHIZA_SERVER_BENCH_LIVE_SLOWEST: 1
          RHIZA_SERVER_BENCH_REQUESTS: 100000
          RHIZA_SERVER_BENCH_CONCURRENCY: 16
        run: |
          lane_file="$RUNNER_TEMP/rhiza-performance/fault-diagnostic-lane.txt"
          if [[ ! -f "$lane_file" ]]; then
            printf 'not-run: failed lane unavailable\n' > "$RUNNER_TEMP/rhiza-performance/fault-diagnostic-status.txt"
            exit 0
          fi
          lane=$(<"$lane_file")
          case "$lane" in
            'n0 n1 async') failed=n0; target=n1; durability=async ;;
            'n1 n2 async') failed=n1; target=n2; durability=async ;;
            'n2 n0 async') failed=n2; target=n0; durability=async ;;
            *) printf 'not-run: reference failure is not a known fault lane (%s)\n' "$lane" > "$RUNNER_TEMP/rhiza-performance/fault-diagnostic-status.txt"; exit 0 ;;
          esac
          printf 'separate diagnostic; source lane=%s; killed-node ring events may be lost\n' "$lane" > "$RUNNER_TEMP/rhiza-performance/fault-diagnostic-status.txt"
          export RHIZA_SERVER_BENCH_FAILED_NODE="$failed" RHIZA_SERVER_BENCH_TARGET_NODE="$target" RHIZA_SERVER_BENCH_DURABILITY="$durability"
          benchmarks/run-server-reference.sh \
            "$RUNNER_TEMP/rhiza-server-candidate" \
            "$RUNNER_TEMP/rhiza-performance/rhiza-server-fault-diagnostic.json"

      - name: Record runner environment
        if: ${{ !inputs.network_optimization || inputs.network_optimization == 'none' }}
        run: |
          {
            printf '\nbaseline_mode=%s\n' '${{ steps.revisions.outputs.baseline_mode }}'
            printf '\nrunner_image=%s\n' "$ImageOS-$ImageVersion"
            printf 'hiqlite_commit=%s\n' fd45e758af9ab2ff976813a6a511772d676562f1
            printf 'hiqlite_result=reused-verified-reference\n'
            printf 'hiqlite_official_log_sync=interval_200\n'
            printf 'hiqlite_durable_log_sync=immediate\n'
            printf 'rhiza_failure_scenarios=each_peer_sigkill_during_timed_workload\n'
            printf 'rhiza_before_ack_scenarios=three_interleaved_healthy_base_and_candidate_http_quic_samples\n'
            printf 'hiqlite_failure_scenarios=raft_leader_or_follower_gracefully_stopped_before_timed_workload\n'
            lscpu
            free -b
          } >>"$RUNNER_TEMP/rhiza-performance/environment.txt"

      - name: Record focused network environment
        if: ${{ inputs.network_optimization && inputs.network_optimization != 'none' }}
        run: |
          {
            printf '\nrunner_image=%s\n' "$ImageOS-$ImageVersion"
            lscpu
            free -b
          } >>"$RUNNER_TEMP/rhiza-performance/environment.txt"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/rhiza-performance
          if-no-files-found: error
          retention-days: 30

  cost-evidence-scope:
    if: ${{ !inputs.before_ack_sample_diagnostics && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(pkg/recovery/archive\.go|internal/objstore/transport_observer_enabled\.go|internal/objstore/transport_observer_test\.go|internal/objstore/providertransport_test\.go|internal/objstore/versity_conditional_put_test\.go|internal/objstore/conditional_put_ambiguity_test\.go|internal/objstore/versityfixture/.*\.go|scripts/ci/versity-conditional-(diagnostic(-test)?|cleanup-gate)\.sh|\.github/workflows/performance\.yml|pkg/node/foreground_cost_lifecycle_test\.go)$'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

  issue185-cost-evidence:
    needs: cost-evidence-scope
    if: ${{ always() && !inputs.before_ack_sample_diagnostics && (inputs.issue185_cost_evidence || (needs.cost-evidence-scope.result == 'success' && needs.cost-evidence-scope.outputs.required == 'true')) }}
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Initialize evidence directory
        run: mkdir -p "$RUNNER_TEMP/issue-185-cost-evidence/logs" "$RUNNER_TEMP/issue-185-cost-evidence/versity-raw"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify pinned local Versity Gateway
        env:
          VERSITY_ARCHIVE_SHA256: 4953096f65a9c0d62ab184fb6b2ba7c2435229205cf00a56cb62cd4bf6b216ca
        run: |
          evidence_dir="$RUNNER_TEMP/issue-185-cost-evidence"
          mkdir -p "$evidence_dir/versity"
          archive="$RUNNER_TEMP/versitygw_v1.8.0_Darwin_arm64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/versity/versitygw/releases/download/v1.8.0/versitygw_v1.8.0_Darwin_arm64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$VERSITY_ARCHIVE_SHA256" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$evidence_dir/versity"
          binary="$evidence_dir/versity/versitygw_v1.8.0_Darwin_arm64/versitygw"
          test -x "$binary"
          test "$(uname -m)" = arm64
          binary_version=$("$binary" --version)
          printf '%s\n' "$binary_version" | grep -F 'Version  : 1.8.0'
          binary_sha256=$(shasum -a 256 "$binary" | awk '{print $1}')
          printf 'RHIZA_VERSITYGW_BIN=%s\n' "$binary" >>"$GITHUB_ENV"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner_label=macos-15\n'
            printf 'macos_version=%s\n' "$(sw_vers -productVersion)"
            printf 'architecture=%s\n' "$(uname -m)"
            printf 'go=%s\n' "$(go version)"
            printf 'versity_archive_sha256=%s\n' "$VERSITY_ARCHIVE_SHA256"
            printf 'versity_binary_sha256=%s\n' "$binary_sha256"
            printf 'versity_version=%s\n' "$binary_version"
          } >"$evidence_dir/environment.txt"

      - name: Trace baseline Versity conditional PUT case
        id: versity-conditional-diagnostic
        continue-on-error: true
        env:
          CGO_ENABLED: "1"
          RHIZA_DIAGNOSTIC_DIR: ${{ runner.temp }}/versity-conditional-diagnostic
          # Keep raw server output out of artifacts: only the bounded,
          # non-secret client trace and aggregated server counts are uploaded.
          RHIZA_DIAGNOSTIC_RAW_DIR: ${{ runner.temp }}/versity-conditional-raw
          RHIZA_DIAGNOSTIC_MODES: baseline
        run: |
          sh scripts/ci/versity-conditional-diagnostic-test.sh
          sh scripts/ci/versity-conditional-diagnostic.sh

      - name: Upload baseline conditional PUT trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versity-conditional-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/versity-conditional-diagnostic/baseline
          if-no-files-found: error
          retention-days: 30

      - name: Confirm diagnostic gateways stopped
        id: versity-cleanup-gate
        if: always() && !cancelled()
        env:
          RHIZA_DIAGNOSTIC_DIR: ${{ runner.temp }}/versity-conditional-diagnostic
          RHIZA_DIAGNOSTIC_RAW_DIR: ${{ runner.temp }}/versity-conditional-raw
          CURRENT_CLEANUP_CONFIRMED: ${{ steps.versity-conditional-diagnostic.outputs.cleanup_confirmed }}
          RHIZA_DIAGNOSTIC_MODES: baseline
        run: |
          test "$CURRENT_CLEANUP_CONFIRMED" = true
          sh scripts/ci/versity-conditional-cleanup-gate.sh

      - name: Run local provider and foreground evidence serially
        if: ${{ success() && steps.versity-cleanup-gate.outcome == 'success' }}
        env:
          CGO_ENABLED: "1"
          RHIZA_VERSITY_EVIDENCE_DIR: ${{ runner.temp }}/issue-185-cost-evidence/versity-raw
        run: |
          evidence_dir="$RUNNER_TEMP/issue-185-cost-evidence"
          mkdir -p "$evidence_dir/logs"
          : >"$evidence_dir/commands.txt"
          : >"$evidence_dir/exits.tsv"
          : >"$evidence_dir/cleanup.tsv"
          gateway_run_dirs() {
            base=$RHIZA_VERSITY_EVIDENCE_DIR
            [ -d "$base" ] || return 0
            for run_dir in "$base"/versity-*; do
              [ -d "$run_dir" ] && printf '%s\n' "$run_dir"
            done
            return 0
          }
          wait_for_gateway_completion() {
            previous_runs=$1
            while IFS= read -r run_dir; do
              [ -d "$run_dir" ] || continue
              if printf '%s\n' "$previous_runs" | grep -Fqx "$run_dir"; then
                continue
              fi
              marker="$run_dir/gateway-complete"
              attempt=0
              while [ ! -f "$marker" ] && [ "$attempt" -lt 100 ]; do
                sleep 0.1
                attempt=$((attempt + 1))
              done
              if [ ! -f "$marker" ]; then
                printf '%s\tmissing-after-10s\n' "$run_dir" | tee -a "$evidence_dir/cleanup.tsv"
                return 1
              fi
              if ! grep -Fqx 'gateway_reaped=true' "$marker"; then
                printf '%s\tinvalid-completion-marker\n' "$run_dir" | tee -a "$evidence_dir/cleanup.tsv"
                return 1
              fi
              printf '%s\tcomplete\t' "$run_dir" | tee -a "$evidence_dir/cleanup.tsv"
              tr '\n' ' ' <"$marker" | tee -a "$evidence_dir/cleanup.tsv"
              printf '\n' | tee -a "$evidence_dir/cleanup.tsv"
            done < <(gateway_run_dirs)
          }
          run_logged() {
            label=$1
            shift
            {
              printf '%s\t' "$label"
              printf '%q ' "$@"
              printf '\n'
            } | tee -a "$evidence_dir/commands.txt"
            previous_runs=$(gateway_run_dirs)
            if "$@" >"$evidence_dir/logs/$label.log" 2>&1; then
              status=0
            else
              status=$?
            fi
            if wait_for_gateway_completion "$previous_runs"; then
              cleanup_status=0
            else
              cleanup_status=$?
            fi
            printf '%s\t%s\n' "$label" "$status" | tee -a "$evidence_dir/exits.tsv"
            cat "$evidence_dir/logs/$label.log"
            if [[ $status -ne 0 ]]; then
              return "$status"
            fi
            # Exit zero also means a stale -run selector matched no tests.
            if ! grep -Eq '^--- PASS: Test[^[:space:]]* ' "$evidence_dir/logs/$label.log"; then
              printf '%s: no passing test executed\n' "$label" >&2
              return 1
            fi
            if [[ $cleanup_status -ne 0 ]]; then
              return "$cleanup_status"
            fi
          }

          run_logged versity-smoke env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=2m ./internal/objstore \
            -run '^TestVersityGatewayCostEvidence$'
          run_logged versity-sdk-retry env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=2m ./internal/objstore \
            -run '^TestVersitySDKRetryEvidence$'
          run_logged archive-attribution-regression env \
            CGO_ENABLED=1 go test -count=1 -v -tags rhiza_local_testhooks -timeout=2m ./pkg/recovery \
            -run '^TestArchiveExtentAttributionActualGuard$'
          run_logged checkpoint-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=5m ./pkg/checkpoint \
            -run '^TestCheckpointCost$'
          run_logged archive-gc-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=5m ./pkg/recovery \
            -run '^TestArchiveGCCost$'
          run_logged node-open-restore-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -timeout=5m ./pkg/node \
            -run '^TestCheckpointRestoreCostExercisesNodeRecoveryPathS3$'
          run_logged node-learn-gap-lifecycle-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -tags rhiza_local_testhooks -timeout=3m ./pkg/node \
            -run '^TestNodeOpenCatchUpRepairsHeldLearnGapForConcurrentKVCalls$'
          run_logged node-learn-gap-lifecycle-race-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            go test -count=1 -v -race -tags rhiza_local_testhooks -timeout=3m ./pkg/node \
            -run '^TestNodeOpenCatchUpRepairsHeldLearnGapForConcurrentKVCalls$'
          run_logged node-foreground-cost-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            RHIZA_NODE_FOREGROUND_API_COST=1 \
            RHIZA_NODE_FOREGROUND_API_COST_SCENARIO=baseline \
            go test -count=1 -v -tags rhiza_local_testhooks -timeout=7m ./pkg/node \
            -run '^TestNodeForegroundAPICostS3$'
          run_logged node-foreground-checkpoint-active-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            RHIZA_NODE_FOREGROUND_API_COST=1 \
            RHIZA_NODE_FOREGROUND_API_COST_SCENARIO=checkpoint-active \
            go test -count=1 -v -tags rhiza_local_testhooks -timeout=7m ./pkg/node \
            -run '^TestNodeForegroundAPICostS3$'
          # HA archives are append-only and reject online GC. The independent
          # archive-gc-s3 test above continues to measure the supported GC path.
          printf '%s\n' 'HA foreground archive GC: unsupported (append-only archive); not a passing GC measurement' | tee "$evidence_dir/ha-foreground-gc-unsupported.txt"
          run_logged node-foreground-async-s3 env \
            RHIZA_VERSITYGW_BIN="$RHIZA_VERSITYGW_BIN" \
            RHIZA_NODE_FOREGROUND_API_COST=1 \
            RHIZA_NODE_FOREGROUND_API_COST_SCENARIO=baseline \
            RHIZA_NODE_FOREGROUND_DURABILITY=async \
            go test -count=1 -v -tags rhiza_local_testhooks -timeout=7m ./pkg/node \
            -run '^TestNodeForegroundAPICostS3$'

      - name: Require baseline conditional PUT diagnostic to pass
        if: always() && !cancelled()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.versity-conditional-diagnostic.outcome }}
        run: test "$DIAGNOSTIC_OUTCOME" = success

      - name: Upload issue 185 cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-185-cost-evidence-${{ github.run_id }}
          # The unfiltered server logs can contain request identifiers or
          # credentials. Retain sanitized test summaries and completion
          # markers only; diagnostic HTTP events use a bounded schema.
          path: |
            ${{ runner.temp }}/issue-185-cost-evidence
            !${{ runner.temp }}/issue-185-cost-evidence/**/s3-access.log
            !${{ runner.temp }}/issue-185-cost-evidence/**/server-output.log
          if-no-files-found: error
          retention-days: 30

  before-ack-sampled-diagnostics:
    needs: [paired-go-benchmarks, issue185-cost-evidence, fault-latency-trials]
    if: ${{ always() && !cancelled() && inputs.before_ack_sample_diagnostics }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tagged archive diagnostic correlation
        run: |
          go test -tags rhiza_latency_diag ./pkg/recovery -run '^TestArchiveBatchTraceRealRecursionAndFailure$' -count=1 -timeout=2m
          CGO_ENABLED=1 go test -race -tags rhiza_latency_diag ./pkg/recovery -run '^TestArchiveBatchTraceRealRecursionAndFailure$' -count=1 -timeout=2m
          go test -tags 'rhiza_latency_diag rhiza_local_testhooks' ./pkg/quepaxa ./pkg/network -run '^(TestTaggedRealWALTraceRecordsLinkSlotsAndBatches|TestTaggedApplyTraceSeparatesLockAndMaterialization)$' -count=1 -timeout=2m
          CGO_ENABLED=1 go test -race -tags 'rhiza_latency_diag rhiza_local_testhooks' ./pkg/quepaxa ./pkg/network -run '^(TestTaggedRealWALTraceRecordsLinkSlotsAndBatches|TestTaggedApplyTraceSeparatesLockAndMaterialization)$' -count=1 -timeout=2m
      - name: Calibrate sampled diagnostics on one runner
        env:
          GH_TOKEN: ${{ github.token }}
          RHIZA_SERVER_BENCH_DURABILITY: before-ack
          RHIZA_SERVER_BENCH_REQUESTS: 10000
          RHIZA_SERVER_BENCH_CONCURRENCY: 16
          RHIZA_SERVER_BENCH_RECORD_BUILD_ID: 1
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/before-ack-sampled-diagnostics"
          mkdir -p "$dir"
          start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          snapshot() {
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/performance.yml/runs?per_page=100" |
              jq -e -c -f scripts/ci/flatten-performance-pages.jq
          }
          printf '%s\n' 'invalid: preflight inventory unavailable or malformed; no measurement started' > "$dir/concurrency-status.txt"
          snapshot > "$dir/.runs-before.ndjson"
          jq -s -e --slurpfile before /dev/null --arg phase pre --arg own "$GITHUB_RUN_ID" --arg start "$start" --arg end "$start" -f scripts/ci/assess-performance-overlap.jq "$dir/.runs-before.ndjson" > "$dir/concurrency-before.json"
          if ! jq -e '.overlaps | length == 0' "$dir/concurrency-before.json" >/dev/null; then
            printf '%s\n' 'blocked: another performance workflow was active before calibration' > "$dir/concurrency-status.txt"
            exit 1
          fi
          finish() {
            rc=$?
            trap - EXIT
            end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if ! snapshot > "$dir/.runs-after.ndjson" || ! jq -s -e --slurpfile before "$dir/.runs-before.ndjson" --arg phase post --arg own "$GITHUB_RUN_ID" --arg start "$start" --arg end "$end" -f scripts/ci/assess-performance-overlap.jq "$dir/.runs-after.ndjson" > "$dir/concurrency-after.json"; then
              printf '%s\n' 'invalid: performance workflow inventory unavailable or malformed' > "$dir/concurrency-status.txt"
              rc=1
            elif ! jq -e '.overlaps | length == 0' "$dir/concurrency-after.json" >/dev/null; then
              printf '%s\n' 'invalid: overlapping performance workflow detected' > "$dir/concurrency-status.txt"
              rc=1
            else
              printf '%s\n' 'no overlap observed in Actions snapshots; API eventual consistency remains a limitation' > "$dir/concurrency-status.txt"
            fi
            exit "$rc"
          }
          trap finish EXIT
          git rev-parse HEAD > "$dir/commit.txt"
          printf '%s\n' 'Temporary diagnostic, remove after investigation: 1/16 slots, up to 64 slowest retained completed client samples; not representative p99. Apply target slots are the requested through value, not the actual batch endpoint. WAL worker batching and lock intervals start when the worker runs and exclude earlier queue delay; batching-and-lock includes the lock interval. Batch wait does not itself prove publication; final slot result has a request ID and no inferred batch. Only HEAD and extent upload attempts are mapped to their batch; attempt IDs represent upper-level SDK calls, not individual SDK HTTP retries. Other storage calls remain unknown. IDs are process-local. Off/on compares the complete tagged instrumentation against untagged, not merely slot sampling. Same-runner calibration is approximate; runner noise and unmeasured effects remain. Ring loss and killed processes can hide events; missing records are unknown. Artifacts contain only fixed-schema traces and synthetic test aggregate data; raw process logs and raw error samples are excluded.' > "$dir/README.txt"
          printf '%s\n' 'Archive timer is actual elapsed time. Load, acquire, confirm, release, extent build and HEAD refresh events measure whole named operations and may include multiple provider calls, retries, validation, or local work. They are not individual HTTP spans and may overlap other intervals. A missing event is unknown, never zero.' >> "$dir/README.txt"
          for phase in off-1 on-1 on-2 off-2; do
            case "$phase" in on-*) diag=1 ;; *) diag=0 ;; esac
            rc=0
            RHIZA_SERVER_BENCH_LATENCY_DIAGNOSTICS="$diag" RHIZA_SERVER_BENCH_LIVE_PROGRESS="$diag" RHIZA_SERVER_BENCH_SLOT_SAMPLES="$diag" \
              benchmarks/run-server-reference.sh "$GITHUB_WORKSPACE" "$dir/$phase.json" || rc=$?
            printf '%s\n' "$rc" > "$dir/$phase.exit"
            if [ -f "$dir/$phase.json" ]; then jq -f scripts/ci/sanitize-before-ack-diagnostic.jq "$dir/$phase.json" > "$dir/$phase-sanitized.json"; fi
            for node in 0 1 2; do
              if [ -f "$dir/$phase-node-$node.log" ]; then awk '$1 == "rhiza_latency" && $2 ~ /^dropped=[0-9]+$/ && NF == 2 {print; next} $1 == "rhiza_latency" && $2 ~ /^stage=(before_ack_wait|record_quorum|consensus_slot|wal_group_wait|wal_group_sync|wal_group_file_sync|wal_group_lock|wal_worker_batching_and_lock|wal_worker_queue_lock|peer_rpc|proposal_target_apply|apply_target_lock|apply_target_wait_tip|apply_target_ensure_durable|apply_target_material_batch|archive_batch_timer|archive_load_initial|archive_load_retry|archive_load_recheck|archive_load_locked|archive_extent_build|archive_head_refresh|archive_lease_confirm|archive_lease_acquire|archive_lease_release|archive_batch_wait|archive_batch_target|archive_batch_result|archive_slot_result|archive_head_upload|archive_extent_upload)$/ && $3 ~ /^batch=[0-9]+$/ && $4 ~ /^slot=[0-9]+$/ && $5 ~ /^count=[0-9]+$/ && $6 ~ /^peer=[0-9a-f]+$/ && $7 ~ /^outcome=(ok|error|cancelled|skipped|error_before_sync|provisional|final|success_tip_unknown|success_tip_covered)$/ && $8 ~ /^start_unix_ns=[0-9]+$/ && $9 ~ /^end_unix_ns=[0-9]+$/ && $10 ~ /^duration_ns=[0-9]+$/ && $11 ~ /^request=[0-9]+$/ && $12 ~ /^attempt=[0-9]+$/ && NF == 12 {print}' "$dir/$phase-node-$node.log" > "$dir/$phase-node-$node-trace.txt"; fi
            done
            if [ "$rc" -ne 0 ]; then exit "$rc"; fi
            if [ "$diag" -eq 1 ]; then
              check=0
              jq -e '.result.slot_evidence.slot_samples_enabled == true and (.result.slot_evidence.slot_samples | length > 0)' "$dir/$phase.json" >/dev/null || check=1
              awk '/rhiza_latency stage=before_ack_wait / {for (i=1;i<=NF;i++) if ($i ~ /^slot=/) {split($i,a,"="); if (a[2] > 0 && a[2] % 16 == 0) found=1}} END {exit !found}' "$dir/$phase-node-1.log" || check=1
              printf '%s\n' "$check" > "$dir/$phase.validation-exit"
              if [ "$check" -ne 0 ]; then exit "$check"; fi
            fi
          done
          for field in client_sha256 source_sha; do
            off=$(sed -n "s/^$field=//p" "$dir/off-1-build.txt")
            on=$(sed -n "s/^$field=//p" "$dir/on-1-build.txt")
            if [ -z "$off" ] || [ "$off" != "$on" ]; then printf 'cross-mode.%s=mismatch\n' "$field" >> "$dir/calibration-status.txt"; exit 1; fi
            printf 'cross-mode.%s=match\n' "$field" >> "$dir/calibration-status.txt"
          done
          for mode in off on; do
            for field in server_sha256 client_sha256 source_sha; do
              first=$(sed -n "s/^$field=//p" "$dir/$mode-1-build.txt")
              second=$(sed -n "s/^$field=//p" "$dir/$mode-2-build.txt")
              if [ -z "$first" ] || [ "$first" != "$second" ]; then printf '%s.%s=mismatch\n' "$mode" "$field" >> "$dir/calibration-status.txt"; exit 1; fi
              printf '%s.%s=match\n' "$mode" "$field" >> "$dir/calibration-status.txt"
            done
          done
          for phase in on-1 on-2; do
            jq -r '.result.slot_evidence.slot_samples[] | [.slot,.start_unix_ns,.measured_end_unix_ns] | @tsv' "$dir/$phase-sanitized.json" > "$dir/$phase-client-slots.txt"
            awk 'FNR==NR {n++;slots[n]=$1;begin[n]=$2;end[n]=$3;next} /^rhiza_latency dropped=/ {split($2,a,"=");dropped+=a[2]} /^rhiza_latency stage=/ {stage="";slot=0;start=0;finish=0;for(i=1;i<=NF;i++){split($i,a,"=");if(a[1]=="stage")stage=a[2];if(a[1]=="slot")slot=a[2];if(a[1]=="start_unix_ns")start=a[2];if(a[1]=="end_unix_ns")finish=a[2]} if(stage=="before_ack_wait" || stage=="record_quorum" || stage=="consensus_slot" || stage=="wal_group_wait" || stage=="peer_rpc") for(i=1;i<=n;i++) if(slots[i]==slot) {if(start+2048<=end[i] && finish-2048>=begin[i]) matched[stage,slot]=1; else if(start-2048<=end[i] && finish+2048>=begin[i]) ambiguous++}} END {for(k in matched){split(k,a,SUBSEP);count[a[1]]++} for(s in count) print s,count[s];print "boundary_ambiguous",ambiguous+0;print "reported_server_drops",dropped+0}' "$dir/$phase-client-slots.txt" "$dir/$phase"-node-*-trace.txt > "$dir/$phase-slot-overlap.txt"
            printf '%s\n' 'Floating-point epoch nanoseconds have finite precision: a 2048 ns boundary margin is unknown, not a confirmed overlap. Missing stage/slot is unknown; ring drop or process termination may lose traces. Do not sum overlapping intervals.' >> "$dir/$phase-slot-overlap.txt"
          done
      - name: Upload separate sampled diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: before-ack-sampled-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/before-ack-sampled-diagnostics/preflight-status.txt
            ${{ runner.temp }}/before-ack-sampled-diagnostics/concurrency-status.txt
            ${{ runner.temp }}/before-ack-sampled-diagnostics/concurrency-before.json
            ${{ runner.temp }}/before-ack-sampled-diagnostics/concurrency-after.json
            ${{ runner.temp }}/before-ack-sampled-diagnostics/README.txt
            ${{ runner.temp }}/before-ack-sampled-diagnostics/commit.txt
            ${{ runner.temp }}/before-ack-sampled-diagnostics/calibration-status.txt
            ${{ runner.temp }}/before-ack-sampled-diagnostics/*-build.txt
            ${{ runner.temp }}/before-ack-sampled-diagnostics/*-trace.txt
            ${{ runner.temp }}/before-ack-sampled-diagnostics/*-client-slots.txt
            ${{ runner.temp }}/before-ack-sampled-diagnostics/*-slot-overlap.txt
            ${{ runner.temp }}/before-ack-sampled-diagnostics/*.exit
            ${{ runner.temp }}/before-ack-sampled-diagnostics/*-live-progress.jsonl
            ${{ runner.temp }}/before-ack-sampled-diagnostics/*-sanitized.json
          if-no-files-found: error
          retention-days: 30

  fault-latency-trials:
    # Keep heavy experiments serialized even when an earlier gate fails.
    needs: [paired-go-benchmarks, issue185-cost-evidence]
    if: ${{ always() && !cancelled() && !inputs.before_ack_sample_diagnostics && !inputs.refresh_hiqlite_reference && !inputs.issue185_cost_evidence && (inputs.network_optimization == '' || inputs.network_optimization == 'none') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run bounded n0 fault diagnostics
        env:
          RHIZA_SERVER_BENCH_LATENCY_DIAGNOSTICS: 1
          RHIZA_SERVER_BENCH_LIVE_PROGRESS: 1
          RHIZA_SERVER_BENCH_LIVE_SLOWEST: 1
          RHIZA_SERVER_BENCH_FAILED_NODE: n0
          RHIZA_SERVER_BENCH_TARGET_NODE: n1
          RHIZA_SERVER_BENCH_DURABILITY: async
          RHIZA_SERVER_BENCH_REQUESTS: 100000
          RHIZA_SERVER_BENCH_CONCURRENCY: 16
        run: |
          mkdir -p "$RUNNER_TEMP/fault-latency-trials"
          git rev-parse HEAD > "$RUNNER_TEMP/fault-latency-trials/commit.txt"
          printf '%s\n' 'Tagged diagnostics are separate from the performance gate; killed-process buffered events may be lost and shared WAL events cannot be summed by slot.' > "$RUNNER_TEMP/fault-latency-trials/README.txt"
          status=0
          for trial in 1 2 3; do
            rc=0
            benchmarks/run-server-reference.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fault-latency-trials/trial-$trial.json" || rc=$?
            printf '%s\n' "$rc" > "$RUNNER_TEMP/fault-latency-trials/trial-$trial.exit"
            if [ "$rc" -ne 0 ]; then status=$rc; break; fi
          done
          exit "$status"
      - name: Upload fault latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-latency-trials-${{ github.run_id }}
          path: ${{ runner.temp }}/fault-latency-trials
          if-no-files-found: error
          retention-days: 30

  refresh-hiqlite-reference:
    if: ${{ !inputs.before_ack_sample_diagnostics && inputs.refresh_hiqlite_reference }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HIQLITE_VERSION: v0.16.0
      HIQLITE_COMMIT: fd45e758af9ab2ff976813a6a511772d676562f1
      HIQLITE_RUST_TOOLCHAIN: 1.97.1
      HIQLITE_REQUESTS: 100000
      HIQLITE_CONCURRENCY: 16
    steps:
      - uses: actions/checkout@v4
      - name: Measure pinned Hiqlite reference
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/hiqlite-target"
          rustup toolchain install "$HIQLITE_RUST_TOOLCHAIN" --profile minimal
          [[ $(git ls-remote --tags --refs https://github.com/sebadob/hiqlite.git "refs/tags/$HIQLITE_VERSION" | cut -f1) == "$HIQLITE_COMMIT" ]]
          git clone --filter=blob:none https://github.com/sebadob/hiqlite.git "$RUNNER_TEMP/hiqlite"
          git -C "$RUNNER_TEMP/hiqlite" checkout --detach "$HIQLITE_COMMIT"
          git -C "$RUNNER_TEMP/hiqlite" apply --unidiff-zero --whitespace=nowarn "$GITHUB_WORKSPACE/benchmarks/hiqlite-one-peer.patch"
          cargo +"$HIQLITE_RUST_TOOLCHAIN" build --release --manifest-path "$RUNNER_TEMP/hiqlite/examples/bench/Cargo.toml"
          mkdir -p "$RUNNER_TEMP/hiqlite-reference"
          cd "$RUNNER_TEMP/hiqlite/examples/bench"
          printf 'Measuring interval_200_local\n'
          HQL_LOG_SYNC=interval_200 timeout 10m "$CARGO_TARGET_DIR/release/bench" cluster --sql-only -c "$HIQLITE_CONCURRENCY" -r "$HIQLITE_REQUESTS" >"$RUNNER_TEMP/hiqlite-reference/interval_200_local.txt" 2>&1
          printf 'Measuring immediate_local\n'
          HQL_LOG_SYNC=immediate timeout 10m "$CARGO_TARGET_DIR/release/bench" cluster --sql-only -c "$HIQLITE_CONCURRENCY" -r "$HIQLITE_REQUESTS" >"$RUNNER_TEMP/hiqlite-reference/immediate_local.txt" 2>&1
          printf 'Measuring immediate_remote\n'
          HQL_LOG_SYNC=immediate timeout 10m "$CARGO_TARGET_DIR/release/bench" cluster --remote-client --sql-only -c "$HIQLITE_CONCURRENCY" -r "$HIQLITE_REQUESTS" >"$RUNNER_TEMP/hiqlite-reference/immediate_remote.txt" 2>&1
          printf 'Measuring immediate_follower_stopped\n'
          HQL_LOG_SYNC=immediate timeout 10m "$CARGO_TARGET_DIR/release/bench" cluster --remote-client --sql-only --fail-peer non-leader -c "$HIQLITE_CONCURRENCY" -r "$HIQLITE_REQUESTS" >"$RUNNER_TEMP/hiqlite-reference/immediate_follower_stopped.txt" 2>&1
          printf 'Measuring immediate_leader_stopped\n'
          HQL_LOG_SYNC=immediate timeout 10m "$CARGO_TARGET_DIR/release/bench" cluster --remote-client --sql-only --fail-peer leader -c "$HIQLITE_CONCURRENCY" -r "$HIQLITE_REQUESTS" >"$RUNNER_TEMP/hiqlite-reference/immediate_leader_stopped.txt" 2>&1
          for scenario in interval_200_local immediate_local immediate_remote immediate_follower_stopped immediate_leader_stopped; do
            file="$RUNNER_TEMP/hiqlite-reference/$scenario.txt"
            ops=$(awk '/single INSERTs/{getline; print $4; exit}' "$file")
            [[ $ops =~ ^[0-9]+$ ]]
            printf '%s=%s\n' "$scenario" "$ops" >>"$RUNNER_TEMP/hiqlite-reference/ops.txt"
          done
          evidence="$RUNNER_TEMP/hiqlite-reference/evidence"
          mkdir -p "$evidence"
          runner_image="$ImageOS-$ImageVersion"
          rust_version=$(rustc +"$HIQLITE_RUST_TOOLCHAIN" --version)
          printf 'runner_image=%s\nrust=%s\n' "$runner_image" "$rust_version" >"$evidence/environment.txt"
          for scenario in interval_200_local immediate_local immediate_remote immediate_follower_stopped immediate_leader_stopped; do
            gzip -n -c "$RUNNER_TEMP/hiqlite-reference/$scenario.txt" >"$evidence/$scenario.txt.gz"
          done
          evidence_sha256=$(for file in "$evidence"/*; do
            jq -n --arg file "$(basename "$file")" --arg sha "$(sha256sum "$file" | cut -d' ' -f1)" '{($file):$sha}'
          done | jq -s add)
          jq -n \
            --arg version "$HIQLITE_VERSION" \
            --arg commit "$HIQLITE_COMMIT" \
            --arg patch "$(sha256sum "$GITHUB_WORKSPACE/benchmarks/hiqlite-one-peer.patch" | cut -d' ' -f1)" \
            --arg measured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg source_head_sha "$GITHUB_SHA" \
            --arg runner_image "$runner_image" \
            --arg rust_version "$rust_version" \
            --argjson requests "$HIQLITE_REQUESTS" \
            --argjson concurrency "$HIQLITE_CONCURRENCY" \
            --argjson evidence_sha256 "$evidence_sha256" \
            --rawfile ops "$RUNNER_TEMP/hiqlite-reference/ops.txt" \
            '{version:$version,commit:$commit,patch_sha256:$patch,measured_at:$measured_at,source_run:$source_run,source_head_sha:$source_head_sha,runner_image:$runner_image,rust_version:$rust_version,requests:$requests,concurrency:$concurrency,evidence_sha256:$evidence_sha256,ops_per_sec:($ops|split("\n")|map(select(length>0)|split("="))|map({(.[0]):(.[1]|tonumber)})|add)}' \
            >"$RUNNER_TEMP/hiqlite-reference/hiqlite-reference.json"
          cat "$RUNNER_TEMP/hiqlite-reference/hiqlite-reference.json"
          bash "$GITHUB_WORKSPACE/benchmarks/verify-hiqlite-reference-artifact.sh" \
            "$RUNNER_TEMP/hiqlite-reference/hiqlite-reference.json" "$evidence"
      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiqlite-reference-${{ github.run_id }}
          path: ${{ runner.temp }}/hiqlite-reference
          if-no-files-found: error
          retention-days: 30
